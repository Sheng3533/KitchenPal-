spring.application.name=KitchenPalAPI
server.port=18080

# 每日美食图片生成（Pollinations 免费文生图，flux 模型，免 API key、直连可达）
# 图片统一保存在项目根目录下的 static/images，按日期命名（yyyy-MM-dd.png），
# 跨天自动累积、永不覆盖/删除，历史图片越攒越多。
# 说明：原阿里百炼 qwen-image-3.0 接口 host 在本机不可达（连接超时）且额度已耗尽，
# 故改为 Pollinations。下方 base-url/model/api-key 已不再使用，仅保留以免破坏配置解析。
image.base-url=https://image.pollinations.ai/prompt
image.model=flux
image.save-dir=d:/project/KitchenPal/KitchenPalAPI/static/images
image.enabled=true
# 图片接口鉴权密钥（Pollinations 免 key，留空即可）。
image.api-key=

llm.api-key=
llm.base-url=http://localhost:11434/v1


llm.model=qwen3.5:2b


llm.vision-model=qwen3.5:2b

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/kitchenpal_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=sheng_885_test

# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=kitchenpal-secret-key-please-change-in-production-2026-09-28-abcdefghijklmnop
jwt.expiration=604800000

# 文件上传目录（成品照/头像等）
image.upload-dir=d:/project/KitchenPal/KitchenPalAPI/static/uploads

# springdoc (Swagger UI)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# Jackson
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# 向量召回嵌入模型（可选，留空则用关键词召回；如配 nomic-embed-text 启用语义召回）
llm.embed-model=

# HTTP 访问日志：确认每一次请求是否到达后端（便于调试"后端没收到请求"）
# 慢接口（AI 识图 / 助手对话走本地 Ollama CPU 推理，单次 30~90s）必须放宽连接超时：
# Spring Boot 4 起 server.tomcat.connection-timeout 默认 PT20S，请求处理超过该值时
# Tomcat 会直接关闭连接，App 端表现为 SocketException: Software caused connection abort。
# App 端 Retrofit readTimeout 已放宽到 180s，这里保持对齐（留 3s 余量）。
server.tomcat.connection-timeout=180s
server.tomcat.keep-alive-timeout=60s
server.tomcat.max-swallow-size=-1

server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.pattern=%t %a "%r" %s %b %Dms
server.tomcat.accesslog.prefix=access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.rotate=false
server.tomcat.accesslog.file-date-format=
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.request-attributes-enabled=true

<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索</title>
    <style id="theme-vars">
/* AI Kitchen Assistant - Warm Natural Style */
:root {
  /* Brand Primary - Warm Orange */
  --color-primary: #E8743B;
  --color-primary-light: #F09B6E;
  --color-primary-lighter: #F5C49E;
  --color-primary-lightest: #FBE8D6;
  --color-primary-dark: #C45E2A;
  --color-primary-darker: #9A4A20;

  /* Brand Secondary - Warm Brown */
  --color-secondary: #8B5E3C;
  --color-secondary-light: #B07D55;
  --color-secondary-lighter: #D4A87A;

  /* Neutrals - Warm Toned */
  --color-bg: #FEFAF5;
  --color-bg-warm: #FFF8F0;
  --color-surface: #FFFFFF;
  --color-surface-raised: #FFFCF8;
  --color-surface-overlay: #F5EDE4;
  --color-border: #E8DDD0;
  --color-border-light: #F0E8DE;
  --color-text-primary: #3D2B1F;
  --color-text-secondary: #6B5744;
  --color-text-tertiary: #9A8B7A;
  --color-text-inverse: #FFFFFF;
  --color-text-on-primary: #FFFFFF;

  /* State Colors */
  --state-success: #4A9D5B;
  --state-success-bg: #E8F5EA;
  --state-warning: #E8A33D;
  --state-warning-bg: #FFF4E0;
  --state-error: #D94B4B;
  --state-error-bg: #FDE8E8;
  --state-info: #5B8EC9;
  --state-info-bg: #E8F0FA;

  /* Radius Scale */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Shadows - surface-first, subtle */
  --shadow-sm: 0 1px 3px rgba(61, 43, 31, 0.04);
  --shadow-md: 0 2px 8px rgba(61, 43, 31, 0.06);
  --shadow-lg: 0 4px 16px rgba(61, 43, 31, 0.08);
  --shadow-card: 0 1px 4px rgba(61, 43, 31, 0.05);
  --shadow-card-hover: 0 4px 12px rgba(61, 43, 31, 0.1);
  --shadow-float: 0 8px 32px rgba(61, 43, 31, 0.12);

  /* Typography */
  --font-display: 'DM Serif Display', 'Noto Serif SC', Georgia, serif;
  --font-body: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  /* Type Scale */
  --text-xs: 0.6875rem;     /* 11px */
  --text-sm: 0.8125rem;     /* 13px */
  --text-base: 0.9375rem;    /* 15px */
  --text-md: 1rem;           /* 16px */
  --text-lg: 1.125rem;      /* 18px */
  --text-xl: 1.3125rem;     /* 21px */
  --text-2xl: 1.5rem;       /* 24px */
  --text-3xl: 1.875rem;     /* 30px */
  --text-4xl: 2.25rem;      /* 36px */

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* Z-index */
  --z-above: 10;
  --z-overlay: 50;
  --z-modal: 100;
  --z-toast: 200;
}

/* Typography Classes */
.font-display { font-family: var(--font-display); }
.font-body { font-family: var(--font-body); }
.font-mono { font-family: var(--font-mono); }

.text-primary-color { color: var(--color-primary); }
.text-secondary-color { color: var(--color-secondary); }
.text-warm { color: var(--color-text-primary); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-[375px] mx-auto pb-8">

      <!-- Top Bar -->
      <div class="flex items-center gap-3 px-4 pt-4 pb-2">
        <a data-dom-id="back-from-search" href="home.html" class="flex-shrink-0 w-10 h-10 flex items-center justify-center rounded-full" style="color: var(--color-text-primary);">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div class="flex-1 relative">
          <div class="absolute left-3 top-1/2 -translate-y-1/2" style="color: var(--color-text-tertiary);">
            <i data-lucide="search" class="w-5 h-5"></i>
          </div>
          <input
            type="text"
            placeholder="搜索食谱、食材、做法..."
            class="w-full rounded-full pl-10 pr-10 py-3 text-sm outline-none transition-shadow focus:ring-2"
            style="background: var(--color-surface); color: var(--color-text-primary); box-shadow: var(--shadow-sm); --tw-ring-color: var(--color-primary-lighter);"
          />
          <button class="absolute right-3 top-1/2 -translate-y-1/2" style="color: var(--color-text-tertiary);">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- 热门搜索 -->
      <section class="px-4 mt-5">
        <h3 class="text-sm font-medium mb-3" style="color: var(--color-text-secondary);">热门搜索</h3>
        <div class="flex flex-wrap gap-2">
          <span class="rounded-full px-4 py-2 text-sm cursor-pointer transition-colors hover:opacity-80" style="background: var(--color-surface-overlay); color: var(--color-text-secondary);">番茄炒蛋</span>
          <span class="rounded-full px-4 py-2 text-sm cursor-pointer transition-colors hover:opacity-80" style="background: var(--color-surface-overlay); color: var(--color-text-secondary);">红烧排骨</span>
          <span class="rounded-full px-4 py-2 text-sm cursor-pointer transition-colors hover:opacity-80" style="background: var(--color-surface-overlay); color: var(--color-text-secondary);">家常豆腐</span>
          <span class="rounded-full px-4 py-2 text-sm cursor-pointer transition-colors hover:opacity-80" style="background: var(--color-surface-overlay); color: var(--color-text-secondary);">蒜蓉虾</span>
          <span class="rounded-full px-4 py-2 text-sm cursor-pointer transition-colors hover:opacity-80" style="background: var(--color-surface-overlay); color: var(--color-text-secondary);">糖醋里脊</span>
          <span class="rounded-full px-4 py-2 text-sm cursor-pointer transition-colors hover:opacity-80" style="background: var(--color-surface-overlay); color: var(--color-text-secondary);">清蒸鲈鱼</span>
          <span class="rounded-full px-4 py-2 text-sm cursor-pointer transition-colors hover:opacity-80" style="background: var(--color-surface-overlay); color: var(--color-text-secondary);">宫保鸡丁</span>
          <span class="rounded-full px-4 py-2 text-sm cursor-pointer transition-colors hover:opacity-80" style="background: var(--color-surface-overlay); color: var(--color-text-secondary);">酸辣汤</span>
        </div>
      </section>

      <!-- 搜索历史 -->
      <section class="px-4 mt-6">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-medium" style="color: var(--color-text-secondary);">搜索历史</h3>
          <button class="text-xs" style="color: var(--color-text-tertiary);">清空</button>
        </div>
        <div class="rounded-xl overflow-hidden" style="background: var(--color-surface); box-shadow: var(--shadow-card);">
          <div class="flex items-center gap-3 px-4 py-3 cursor-pointer" style="border-bottom: 1px solid var(--color-border-light);">
            <i data-lucide="clock" class="w-4 h-4 flex-shrink-0" style="color: var(--color-text-tertiary);"></i>
            <span class="text-sm" style="color: var(--color-text-primary);">牛肉炖土豆</span>
          </div>
          <div class="flex items-center gap-3 px-4 py-3 cursor-pointer" style="border-bottom: 1px solid var(--color-border-light);">
            <i data-lucide="clock" class="w-4 h-4 flex-shrink-0" style="color: var(--color-text-tertiary);"></i>
            <span class="text-sm" style="color: var(--color-text-primary);">番茄意面</span>
          </div>
          <div class="flex items-center gap-3 px-4 py-3 cursor-pointer">
            <i data-lucide="clock" class="w-4 h-4 flex-shrink-0" style="color: var(--color-text-tertiary);"></i>
            <span class="text-sm" style="color: var(--color-text-primary);">西兰花炒虾仁</span>
          </div>
        </div>
      </section>

      <!-- 发现频道 -->
      <section class="px-4 mt-6">
        <h3 class="text-sm font-medium mb-3" style="color: var(--color-text-secondary);">发现频道</h3>
        <div class="grid grid-cols-2 gap-3">
          <!-- 快手菜 -->
          <div class="aspect-square rounded-xl flex flex-col items-center justify-center text-white cursor-pointer transition-transform hover:scale-[1.02]" style="background: linear-gradient(135deg, #E8743B, #F09B6E); border-radius: var(--radius-xl);">
            <i data-lucide="clock" class="w-8 h-8 mb-2 opacity-90"></i>
            <span class="text-base font-semibold">快手菜</span>
            <span class="text-xs mt-1 opacity-80">10分钟搞定</span>
          </div>
          <!-- 家常菜 -->
          <div class="aspect-square rounded-xl flex flex-col items-center justify-center text-white cursor-pointer transition-transform hover:scale-[1.02]" style="background: linear-gradient(135deg, #8B5E3C, #B07D55); border-radius: var(--radius-xl);">
            <i data-lucide="home" class="w-8 h-8 mb-2 opacity-90"></i>
            <span class="text-base font-semibold">家常菜</span>
            <span class="text-xs mt-1 opacity-80">家的味道</span>
          </div>
          <!-- 养生汤 -->
          <div class="aspect-square rounded-xl flex flex-col items-center justify-center text-white cursor-pointer transition-transform hover:scale-[1.02]" style="background: linear-gradient(135deg, #4A9D5B, #6BBF7A); border-radius: var(--radius-xl);">
            <i data-lucide="heart" class="w-8 h-8 mb-2 opacity-90"></i>
            <span class="text-base font-semibold">养生汤</span>
            <span class="text-xs mt-1 opacity-80">滋补养生</span>
          </div>
          <!-- 烘焙 -->
          <div class="aspect-square rounded-xl flex flex-col items-center justify-center text-white cursor-pointer transition-transform hover:scale-[1.02]" style="background: linear-gradient(135deg, #D97B93, #E8A0B3); border-radius: var(--radius-xl);">
            <i data-lucide="cake-slice" class="w-8 h-8 mb-2 opacity-90"></i>
            <span class="text-base font-semibold">烘焙</span>
            <span class="text-xs mt-1 opacity-80">甜蜜时光</span>
          </div>
        </div>
      </section>

      <!-- 猜你喜欢 -->
      <section class="px-4 mt-6">
        <h3 class="text-sm font-medium mb-3" style="color: var(--color-text-secondary);">猜你喜欢</h3>
        <div class="flex flex-col gap-3">
          <!-- Recipe Card 1 -->
          <a data-dom-id="link-search-recipe" href="#" class="flex items-center gap-3 rounded-xl p-2 transition-shadow hover:shadow-md" style="background: var(--color-surface); box-shadow: var(--shadow-card);">
            <img src="../assets/image_5_yi19x4.jpg" alt="食谱" class="w-20 h-20 rounded-lg object-cover flex-shrink-0" onerror="this.style.background='var(--color-surface-overlay)';this.alt='图片';" />
            <div class="flex-1 min-w-0">
              <h4 class="text-sm font-medium truncate" style="color: var(--color-text-primary);">奶油蘑菇意面</h4>
              <div class="flex items-center gap-1 mt-1">
                <i data-lucide="clock" class="w-3.5 h-3.5" style="color: var(--color-text-tertiary);"></i>
                <span class="text-xs" style="color: var(--color-text-tertiary);">25分钟</span>
                <span class="text-xs ml-2 px-2 py-0.5 rounded-full" style="background: var(--color-surface-overlay); color: var(--color-text-tertiary);">简单</span>
              </div>
            </div>
          </a>
          <!-- Recipe Card 2 -->
          <a data-dom-id="link-search-recipe" href="#" class="flex items-center gap-3 rounded-xl p-2 transition-shadow hover:shadow-md" style="background: var(--color-surface); box-shadow: var(--shadow-card);">
            <img src="../assets/image_6_yi19x4.jpg" alt="食谱" class="w-20 h-20 rounded-lg object-cover flex-shrink-0" onerror="this.style.background='var(--color-surface-overlay)';this.alt='图片';" />
            <div class="flex-1 min-w-0">
              <h4 class="text-sm font-medium truncate" style="color: var(--color-text-primary);">香煎三文鱼配芦笋</h4>
              <div class="flex items-center gap-1 mt-1">
                <i data-lucide="clock" class="w-3.5 h-3.5" style="color: var(--color-text-tertiary);"></i>
                <span class="text-xs" style="color: var(--color-text-tertiary);">20分钟</span>
                <span class="text-xs ml-2 px-2 py-0.5 rounded-full" style="background: var(--color-surface-overlay); color: var(--color-text-tertiary);">中等</span>
              </div>
            </div>
          </a>
          <!-- Recipe Card 3 (placeholder) -->
          <a data-dom-id="link-search-recipe" href="#" class="flex items-center gap-3 rounded-xl p-2 transition-shadow hover:shadow-md" style="background: var(--color-surface); box-shadow: var(--shadow-card);">
            <img src="../assets/image_9_yi19x4.jpg" alt="日式咖喱饭" class="w-20 h-20 rounded-lg flex-shrink-0 object-cover" />
            <div class="flex-1 min-w-0">
              <h4 class="text-sm font-medium truncate" style="color: var(--color-text-primary);">日式咖喱饭</h4>
              <div class="flex items-center gap-1 mt-1">
                <i data-lucide="clock" class="w-3.5 h-3.5" style="color: var(--color-text-tertiary);"></i>
                <span class="text-xs" style="color: var(--color-text-tertiary);">35分钟</span>
                <span class="text-xs ml-2 px-2 py-0.5 rounded-full" style="background: var(--color-surface-overlay); color: var(--color-text-tertiary);">简单</span>
              </div>
            </div>
          </a>
        </div>
      </section>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>

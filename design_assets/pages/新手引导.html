<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新手引导</title>
    <style id="theme-vars">
/* AI Kitchen Assistant - Warm Natural Style */
:root {
  /* Brand Primary - Warm Orange */
  --color-primary: #E8743B;
  --color-primary-light: #F09B6E;
  --color-primary-lighter: #F5C49E;
  --color-primary-lightest: #FBE8D6;
  --color-primary-dark: #C45E2A;
  --color-primary-darker: #9A4A20;

  /* Brand Secondary - Warm Brown */
  --color-secondary: #8B5E3C;
  --color-secondary-light: #B07D55;
  --color-secondary-lighter: #D4A87A;

  /* Neutrals - Warm Toned */
  --color-bg: #FEFAF5;
  --color-bg-warm: #FFF8F0;
  --color-surface: #FFFFFF;
  --color-surface-raised: #FFFCF8;
  --color-surface-overlay: #F5EDE4;
  --color-border: #E8DDD0;
  --color-border-light: #F0E8DE;
  --color-text-primary: #3D2B1F;
  --color-text-secondary: #6B5744;
  --color-text-tertiary: #9A8B7A;
  --color-text-inverse: #FFFFFF;
  --color-text-on-primary: #FFFFFF;

  /* State Colors */
  --state-success: #4A9D5B;
  --state-success-bg: #E8F5EA;
  --state-warning: #E8A33D;
  --state-warning-bg: #FFF4E0;
  --state-error: #D94B4B;
  --state-error-bg: #FDE8E8;
  --state-info: #5B8EC9;
  --state-info-bg: #E8F0FA;

  /* Radius Scale */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Shadows - surface-first, subtle */
  --shadow-sm: 0 1px 3px rgba(61, 43, 31, 0.04);
  --shadow-md: 0 2px 8px rgba(61, 43, 31, 0.06);
  --shadow-lg: 0 4px 16px rgba(61, 43, 31, 0.08);
  --shadow-card: 0 1px 4px rgba(61, 43, 31, 0.05);
  --shadow-card-hover: 0 4px 12px rgba(61, 43, 31, 0.1);
  --shadow-float: 0 8px 32px rgba(61, 43, 31, 0.12);

  /* Typography */
  --font-display: 'DM Serif Display', 'Noto Serif SC', Georgia, serif;
  --font-body: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  /* Type Scale */
  --text-xs: 0.6875rem;     /* 11px */
  --text-sm: 0.8125rem;     /* 13px */
  --text-base: 0.9375rem;    /* 15px */
  --text-md: 1rem;           /* 16px */
  --text-lg: 1.125rem;      /* 18px */
  --text-xl: 1.3125rem;     /* 21px */
  --text-2xl: 1.5rem;       /* 24px */
  --text-3xl: 1.875rem;     /* 30px */
  --text-4xl: 2.25rem;      /* 36px */

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* Z-index */
  --z-above: 10;
  --z-overlay: 50;
  --z-modal: 100;
  --z-toast: 200;
}

/* Typography Classes */
.font-display { font-family: var(--font-display); }
.font-body { font-family: var(--font-body); }
.font-mono { font-family: var(--font-mono); }

.text-primary-color { color: var(--color-primary); }
.text-secondary-color { color: var(--color-secondary); }
.text-warm { color: var(--color-text-primary); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen bg-[var(--color-bg)] flex flex-col overflow-hidden" style="max-width: 375px; margin: 0 auto;">

        <!-- Top illustration area -->
        <div class="flex-1 flex flex-col items-center justify-center pt-10 relative">

            <!-- Decorative floating elements -->
            <div class="absolute top-12 left-8 w-3 h-3 rounded-full bg-[var(--color-primary-light)] opacity-60 float-dot-1"></div>
            <div class="absolute top-20 right-10 w-2 h-2 rounded-full bg-[var(--color-primary-lighter)] opacity-50 float-dot-2"></div>
            <div class="absolute top-36 left-16 w-4 h-4 rounded-full bg-[var(--color-primary-light)] opacity-40 float-dot-3"></div>
            <div class="absolute top-28 right-16 w-2.5 h-2.5 rounded-full bg-[var(--color-primary-lighter)] opacity-60 float-dot-4"></div>
            <div class="absolute top-48 left-12 w-2 h-2 rounded-full bg-[var(--color-primary-light)] opacity-30 float-dot-5"></div>
            <div class="absolute top-44 right-8 w-3.5 h-3.5 rounded-full bg-[var(--color-primary-lighter)] opacity-35 float-dot-6"></div>

            <!-- Large orange gradient circle with flame icon -->
            <div class="relative flex items-center justify-center" style="width: 12rem; height: 12rem;">
                <div class="w-48 h-48 rounded-full flex items-center justify-center" style="background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light), var(--color-primary-lighter));">
                    <i data-lucide="flame" class="w-20 h-20 text-white" style="color: #FFFFFF;"></i>
                </div>
                <!-- Small decorative ring -->
                <div class="absolute inset-0 rounded-full border-2 border-dashed opacity-20" style="border-color: var(--color-primary-light); width: 14rem; height: 14rem; top: -1rem; left: -1rem;"></div>
            </div>

            <!-- Heading & description -->
            <h1 class="mt-8 text-xl font-bold text-center" style="color: var(--color-text-primary); font-family: var(--font-display);">AI智能火候提醒</h1>
            <p class="mt-3 text-center mx-auto px-6" style="color: var(--color-text-tertiary); max-width: 20rem; font-size: var(--text-sm); line-height: 1.6;">实时监测烹饪温度，智能提醒火候调整，让每道菜都完美出锅</p>

            <!-- Feature highlight cards -->
            <div class="mt-10 w-full flex flex-col gap-3 px-6">

                <!-- Card 1: 拍照识食材 -->
                <div class="flex items-center gap-4 p-4 rounded-xl bg-[var(--color-surface)]" style="box-shadow: var(--shadow-sm); border-radius: var(--radius-xl);">
                    <div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center" style="background: var(--color-primary-lightest);">
                        <i data-lucide="camera" class="w-5 h-5" style="color: var(--color-primary);"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="font-semibold text-sm" style="color: var(--color-text-primary);">拍照识食材</p>
                        <p class="text-xs mt-0.5" style="color: var(--color-text-tertiary);">AI自动识别冰箱里的食材</p>
                    </div>
                    <div class="flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center" style="background: var(--state-success-bg);">
                        <i data-lucide="check" class="w-3.5 h-3.5" style="color: var(--state-success);"></i>
                    </div>
                </div>

                <!-- Card 2: 智能推荐 -->
                <div class="flex items-center gap-4 p-4 rounded-xl bg-[var(--color-surface)]" style="box-shadow: var(--shadow-sm); border-radius: var(--radius-xl);">
                    <div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center" style="background: var(--color-primary-lightest);">
                        <i data-lucide="sparkles" class="w-5 h-5" style="color: var(--color-primary);"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="font-semibold text-sm" style="color: var(--color-text-primary);">智能推荐</p>
                        <p class="text-xs mt-0.5" style="color: var(--color-text-tertiary);">根据食材推荐合适菜谱</p>
                    </div>
                    <div class="flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center" style="background: var(--state-success-bg);">
                        <i data-lucide="check" class="w-3.5 h-3.5" style="color: var(--state-success);"></i>
                    </div>
                </div>

                <!-- Card 3: 火候守护 -->
                <div class="flex items-center gap-4 p-4 rounded-xl bg-[var(--color-surface)]" style="box-shadow: var(--shadow-sm); border-radius: var(--radius-xl);">
                    <div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center" style="background: var(--color-primary-lightest);">
                        <i data-lucide="flame" class="w-5 h-5" style="color: var(--color-primary);"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="font-semibold text-sm" style="color: var(--color-text-primary);">火候守护</p>
                        <p class="text-xs mt-0.5" style="color: var(--color-text-tertiary);">全程监控烹饪火候</p>
                    </div>
                    <div class="flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center" style="background: var(--state-success-bg);">
                        <i data-lucide="check" class="w-3.5 h-3.5" style="color: var(--state-success);"></i>
                    </div>
                </div>

            </div>
        </div>

        <!-- Bottom section -->
        <div class="pb-8 pt-6 flex flex-col items-center">

            <!-- Page indicator dots -->
            <div class="flex items-center gap-2 mb-6">
                <div class="w-2 h-2 rounded-full" style="background: var(--color-primary);"></div>
                <div class="w-2 h-2 rounded-full" style="background: var(--color-primary);"></div>
                <div class="w-3 h-3 rounded-full" style="background: var(--color-primary);"></div>
            </div>

            <!-- CTA button -->
            <button data-dom-id="cta-start" class="w-full mx-6 py-4 rounded-full text-white font-semibold text-base transition-all duration-200 hover:opacity-90 active:scale-[0.98]" style="background: var(--color-primary); color: var(--color-text-on-primary);">
                开始使用
            </button>

            <!-- Skip link -->
            <button class="mt-4 text-sm transition-opacity duration-200 hover:opacity-70" style="color: var(--color-text-tertiary);">
                跳过
            </button>

        </div>

    </main>

    <!-- Floating animations -->
    <style>
    @keyframes floatDot1 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-8px) translateX(4px); }
    }
    @keyframes floatDot2 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-6px) translateX(-5px); }
    }
    @keyframes floatDot3 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-10px) translateX(3px); }
    }
    @keyframes floatDot4 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-7px) translateX(-4px); }
    }
    @keyframes floatDot5 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-5px) translateX(6px); }
    }
    @keyframes floatDot6 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-9px) translateX(-3px); }
    }
    .float-dot-1 { animation: floatDot1 3s ease-in-out infinite; }
    .float-dot-2 { animation: floatDot2 3.5s ease-in-out infinite 0.3s; }
    .float-dot-3 { animation: floatDot3 4s ease-in-out infinite 0.6s; }
    .float-dot-4 { animation: floatDot4 3.2s ease-in-out infinite 0.9s; }
    .float-dot-5 { animation: floatDot5 3.8s ease-in-out infinite 1.2s; }
    .float-dot-6 { animation: floatDot6 4.2s ease-in-out infinite 0.5s; }
    </style>

    <script>lucide.createIcons();</script>
</body>
</html>

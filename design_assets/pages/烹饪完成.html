<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>烹饪完成</title>
    <style id="theme-vars">
/* AI Kitchen Assistant - Warm Natural Style */
:root {
  /* Brand Primary - Warm Orange */
  --color-primary: #E8743B;
  --color-primary-light: #F09B6E;
  --color-primary-lighter: #F5C49E;
  --color-primary-lightest: #FBE8D6;
  --color-primary-dark: #C45E2A;
  --color-primary-darker: #9A4A20;

  /* Brand Secondary - Warm Brown */
  --color-secondary: #8B5E3C;
  --color-secondary-light: #B07D55;
  --color-secondary-lighter: #D4A87A;

  /* Neutrals - Warm Toned */
  --color-bg: #FEFAF5;
  --color-bg-warm: #FFF8F0;
  --color-surface: #FFFFFF;
  --color-surface-raised: #FFFCF8;
  --color-surface-overlay: #F5EDE4;
  --color-border: #E8DDD0;
  --color-border-light: #F0E8DE;
  --color-text-primary: #3D2B1F;
  --color-text-secondary: #6B5744;
  --color-text-tertiary: #9A8B7A;
  --color-text-inverse: #FFFFFF;
  --color-text-on-primary: #FFFFFF;

  /* State Colors */
  --state-success: #4A9D5B;
  --state-success-bg: #E8F5EA;
  --state-warning: #E8A33D;
  --state-warning-bg: #FFF4E0;
  --state-error: #D94B4B;
  --state-error-bg: #FDE8E8;
  --state-info: #5B8EC9;
  --state-info-bg: #E8F0FA;

  /* Radius Scale */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Shadows - surface-first, subtle */
  --shadow-sm: 0 1px 3px rgba(61, 43, 31, 0.04);
  --shadow-md: 0 2px 8px rgba(61, 43, 31, 0.06);
  --shadow-lg: 0 4px 16px rgba(61, 43, 31, 0.08);
  --shadow-card: 0 1px 4px rgba(61, 43, 31, 0.05);
  --shadow-card-hover: 0 4px 12px rgba(61, 43, 31, 0.1);
  --shadow-float: 0 8px 32px rgba(61, 43, 31, 0.12);

  /* Typography */
  --font-display: 'DM Serif Display', 'Noto Serif SC', Georgia, serif;
  --font-body: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  /* Type Scale */
  --text-xs: 0.6875rem;     /* 11px */
  --text-sm: 0.8125rem;     /* 13px */
  --text-base: 0.9375rem;    /* 15px */
  --text-md: 1rem;           /* 16px */
  --text-lg: 1.125rem;      /* 18px */
  --text-xl: 1.3125rem;     /* 21px */
  --text-2xl: 1.5rem;       /* 24px */
  --text-3xl: 1.875rem;     /* 30px */
  --text-4xl: 2.25rem;      /* 36px */

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* Z-index */
  --z-above: 10;
  --z-overlay: 50;
  --z-modal: 100;
  --z-toast: 200;
}

/* Typography Classes */
.font-display { font-family: var(--font-display); }
.font-body { font-family: var(--font-body); }
.font-mono { font-family: var(--font-mono); }

.text-primary-color { color: var(--color-primary); }
.text-secondary-color { color: var(--color-secondary); }
.text-warm { color: var(--color-text-primary); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen flex flex-col items-center justify-center px-6 py-10 relative overflow-hidden" style="background-color: var(--color-bg);">

      <!-- Floating celebration decorations -->
      <div class="absolute inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
        <span class="confetti-dot" style="--delay:0s; --x:8%; --y:12%; --dur:6s; --size:10px; background:var(--color-primary-lighter);"></span>
        <span class="confetti-dot" style="--delay:1.2s; --x:85%; --y:8%; --dur:7s; --size:8px; background:var(--color-primary-light);"></span>
        <span class="confetti-dot" style="--delay:0.6s; --x:15%; --y:75%; --dur:8s; --size:12px; background:var(--color-primary-lightest);"></span>
        <span class="confetti-dot" style="--delay:2s; --x:78%; --y:65%; --dur:5.5s; --size:9px; background:var(--color-secondary-lighter);"></span>
        <span class="confetti-dot" style="--delay:1.8s; --x:50%; --y:5%; --dur:9s; --size:7px; background:var(--color-primary);"></span>
        <span class="confetti-dot" style="--delay:3s; --x:92%; --y:40%; --dur:6.5s; --size:11px; background:var(--color-primary-lighter);"></span>
        <span class="confetti-dot" style="--delay:0.3s; --x:5%; --y:50%; --dur:10s; --size:12px; background:var(--color-primary);"></span>
        <span class="confetti-dot" style="--delay:1.5s; --x:88%; --y:22%; --dur:12s; --size:10px; background:var(--color-primary-light);"></span>
        <span class="confetti-dot" style="--delay:2.5s; --x:72%; --y:82%; --dur:11s; --size:8px; background:var(--state-success);"></span>
        <span class="confetti-dot" style="--delay:4s; --x:20%; --y:88%; --dur:9s; --size:6px; background:var(--state-warning);"></span>
        <span class="confetti-dot" style="--delay:0.8s; --x:95%; --y:55%; --dur:13s; --size:10px; background:var(--state-error);"></span>
      </div>

      <!-- Content wrapper -->
      <div class="relative z-10 w-full max-w-[340px] flex flex-col items-center">

        <!-- Success icon -->
        <div class="w-24 h-24 rounded-full flex items-center justify-center mb-6" style="background: linear-gradient(135deg, var(--color-primary-light), var(--color-primary)); box-shadow: var(--shadow-float);">
          <i data-lucide="check" class="w-12 h-12 text-white" stroke-width="3"></i>
        </div>

        <!-- Heading -->
        <h1 class="text-2xl font-bold text-center mb-2" style="color: var(--color-text-primary);">恭喜，烹饪完成！</h1>

        <!-- Recipe name -->
        <p class="text-lg text-center mb-8" style="color: var(--color-text-secondary);">番茄炖牛腩</p>

        <!-- Divider -->
        <div class="w-full h-px mb-8" style="background-color: var(--color-border);"></div>

        <!-- Cooking stats -->
        <div class="flex justify-around w-full mb-10">
          <!-- Total time -->
          <div class="flex flex-col items-center">
            <div class="w-10 h-10 rounded-full flex items-center justify-center mb-2" style="background-color: var(--color-primary-lightest);">
              <i data-lucide="clock" class="w-5 h-5" style="color: var(--color-primary);"></i>
            </div>
            <span class="text-xl font-bold" style="color: var(--color-text-primary);">45:12</span>
            <span class="text-xs mt-1" style="color: var(--color-text-tertiary);">总用时</span>
          </div>
          <!-- Heat adjustments -->
          <div class="flex flex-col items-center">
            <div class="w-10 h-10 rounded-full flex items-center justify-center mb-2" style="background-color: var(--color-primary-lightest);">
              <i data-lucide="flame" class="w-5 h-5" style="color: var(--color-primary);"></i>
            </div>
            <span class="text-xl font-bold" style="color: var(--color-text-primary);">3次</span>
            <span class="text-xs mt-1" style="color: var(--color-text-tertiary);">火候调整</span>
          </div>
          <!-- Perfect score -->
          <div class="flex flex-col items-center">
            <div class="w-10 h-10 rounded-full flex items-center justify-center mb-2" style="background-color: var(--color-primary-lightest);">
              <i data-lucide="star" class="w-5 h-5" style="color: var(--color-primary);"></i>
            </div>
            <span class="text-xl font-bold" style="color: var(--color-text-primary);">96分</span>
            <span class="text-xs mt-1" style="color: var(--color-text-tertiary);">完美得分</span>
          </div>
        </div>

        <!-- Rating section -->
        <div class="w-full flex flex-col items-center mb-10">
          <p class="text-sm font-medium text-center mb-4" style="color: var(--color-text-secondary);">为这次烹饪打分</p>
          <div class="flex items-center gap-2">
            <!-- Filled stars (4) -->
            <i data-lucide="star" class="w-8 h-8" style="color: var(--color-primary); fill: var(--color-primary);"></i>
            <i data-lucide="star" class="w-8 h-8" style="color: var(--color-primary); fill: var(--color-primary);"></i>
            <i data-lucide="star" class="w-8 h-8" style="color: var(--color-primary); fill: var(--color-primary);"></i>
            <i data-lucide="star" class="w-8 h-8" style="color: var(--color-primary); fill: var(--color-primary);"></i>
            <!-- Empty star (1) -->
            <i data-lucide="star" class="w-8 h-8" style="color: var(--color-border); fill: none;"></i>
          </div>
        </div>

        <!-- Share section -->
        <div class="w-full flex flex-col items-center mb-12">
          <p class="text-sm font-medium text-center mb-5" style="color: var(--color-text-secondary);">分享你的美食</p>
          <div class="flex items-center justify-around w-full">
            <!-- 朋友圈 -->
            <div class="flex flex-col items-center gap-2 cursor-pointer">
              <div class="w-14 h-14 rounded-full flex items-center justify-center" style="background-color: #07C160;">
                <i data-lucide="circle-dot" class="w-6 h-6 text-white"></i>
              </div>
              <span class="text-xs" style="color: var(--color-text-tertiary);">朋友圈</span>
            </div>
            <!-- 微信好友 -->
            <div class="flex flex-col items-center gap-2 cursor-pointer">
              <div class="w-14 h-14 rounded-full flex items-center justify-center" style="background-color: #5B8EC9;">
                <i data-lucide="message-circle" class="w-6 h-6 text-white"></i>
              </div>
              <span class="text-xs" style="color: var(--color-text-tertiary);">微信好友</span>
            </div>
            <!-- 保存图片 -->
            <div class="flex flex-col items-center gap-2 cursor-pointer">
              <div class="w-14 h-14 rounded-full flex items-center justify-center" style="background-color: var(--color-primary-lighter);">
                <i data-lucide="download" class="w-6 h-6" style="color: var(--color-primary-dark);"></i>
              </div>
              <span class="text-xs" style="color: var(--color-text-tertiary);">保存图片</span>
            </div>
          </div>
        </div>

        <!-- Bottom buttons -->
        <div class="w-full flex flex-col gap-3 mt-auto">
          <button class="w-full py-3.5 rounded-full text-base font-medium transition-colors" style="border: 2px solid var(--color-primary); color: var(--color-primary); background: transparent;">
            再做一道
          </button>
          <button class="w-full py-3.5 rounded-full text-base font-medium text-white transition-colors" style="background-color: var(--color-primary);" data-dom-id="cta-share">
            返回首页
          </button>
        </div>

      </div>
    </main>

    <!-- Confetti animation styles -->
    <style>
      @keyframes float-dot {
        0%, 100% {
          transform: translateY(0) translateX(0) scale(1);
          opacity: 0.6;
        }
        25% {
          transform: translateY(-18px) translateX(8px) scale(1.1);
          opacity: 0.9;
        }
        50% {
          transform: translateY(-8px) translateX(-6px) scale(0.95);
          opacity: 0.5;
        }
        75% {
          transform: translateY(-22px) translateX(4px) scale(1.05);
          opacity: 0.8;
        }
      }

      @keyframes float-food {
        0%, 100% {
          transform: translateY(0) translateX(0) rotate(0deg);
          opacity: 0.5;
        }
        33% {
          transform: translateY(-14px) translateX(10px) rotate(12deg);
          opacity: 0.8;
        }
        66% {
          transform: translateY(-20px) translateX(-8px) rotate(-8deg);
          opacity: 0.6;
        }
      }

      .confetti-dot {
        position: absolute;
        left: var(--x);
        top: var(--y);
        width: var(--size);
        height: var(--size);
        border-radius: 50%;
        animation: float-dot var(--dur) ease-in-out var(--delay) infinite;
      }

      .confetti-food {
        position: absolute;
        left: var(--x);
        top: var(--y);
        animation: float-food var(--dur) ease-in-out var(--delay) infinite;
      }
    </style>

    <script>lucide.createIcons();</script>
</body>
</html>

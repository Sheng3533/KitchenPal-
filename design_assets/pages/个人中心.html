<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心</title>
    <style id="theme-vars">
/* AI Kitchen Assistant - Warm Natural Style */
:root {
  /* Brand Primary - Warm Orange */
  --color-primary: #E8743B;
  --color-primary-light: #F09B6E;
  --color-primary-lighter: #F5C49E;
  --color-primary-lightest: #FBE8D6;
  --color-primary-dark: #C45E2A;
  --color-primary-darker: #9A4A20;

  /* Brand Secondary - Warm Brown */
  --color-secondary: #8B5E3C;
  --color-secondary-light: #B07D55;
  --color-secondary-lighter: #D4A87A;

  /* Neutrals - Warm Toned */
  --color-bg: #FEFAF5;
  --color-bg-warm: #FFF8F0;
  --color-surface: #FFFFFF;
  --color-surface-raised: #FFFCF8;
  --color-surface-overlay: #F5EDE4;
  --color-border: #E8DDD0;
  --color-border-light: #F0E8DE;
  --color-text-primary: #3D2B1F;
  --color-text-secondary: #6B5744;
  --color-text-tertiary: #9A8B7A;
  --color-text-inverse: #FFFFFF;
  --color-text-on-primary: #FFFFFF;

  /* State Colors */
  --state-success: #4A9D5B;
  --state-success-bg: #E8F5EA;
  --state-warning: #E8A33D;
  --state-warning-bg: #FFF4E0;
  --state-error: #D94B4B;
  --state-error-bg: #FDE8E8;
  --state-info: #5B8EC9;
  --state-info-bg: #E8F0FA;

  /* Radius Scale */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Shadows - surface-first, subtle */
  --shadow-sm: 0 1px 3px rgba(61, 43, 31, 0.04);
  --shadow-md: 0 2px 8px rgba(61, 43, 31, 0.06);
  --shadow-lg: 0 4px 16px rgba(61, 43, 31, 0.08);
  --shadow-card: 0 1px 4px rgba(61, 43, 31, 0.05);
  --shadow-card-hover: 0 4px 12px rgba(61, 43, 31, 0.1);
  --shadow-float: 0 8px 32px rgba(61, 43, 31, 0.12);

  /* Typography */
  --font-display: 'DM Serif Display', 'Noto Serif SC', Georgia, serif;
  --font-body: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  /* Type Scale */
  --text-xs: 0.6875rem;     /* 11px */
  --text-sm: 0.8125rem;     /* 13px */
  --text-base: 0.9375rem;    /* 15px */
  --text-md: 1rem;           /* 16px */
  --text-lg: 1.125rem;      /* 18px */
  --text-xl: 1.3125rem;     /* 21px */
  --text-2xl: 1.5rem;       /* 24px */
  --text-3xl: 1.875rem;     /* 30px */
  --text-4xl: 2.25rem;      /* 36px */

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* Z-index */
  --z-above: 10;
  --z-overlay: 50;
  --z-modal: 100;
  --z-toast: 200;
}

/* Typography Classes */
.font-display { font-family: var(--font-display); }
.font-body { font-family: var(--font-body); }
.font-mono { font-family: var(--font-mono); }

.text-primary-color { color: var(--color-primary); }
.text-secondary-color { color: var(--color-secondary); }
.text-warm { color: var(--color-text-primary); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-[375px] mx-auto min-h-screen" style="background: var(--color-bg); padding-bottom: 5rem;">

      <!-- Profile Header Card -->
      <div class="px-5 pt-6 pb-2">
        <div class="rounded-3xl px-5 py-5 flex items-center gap-4 relative" style="background: linear-gradient(135deg, var(--color-primary-lighter), var(--color-primary-lightest));">
          <!-- Avatar -->
          <div class="w-16 h-16 rounded-full flex items-center justify-content-center flex-shrink-0" style="background: var(--color-primary);">
            <i data-lucide="user" style="width:28px;height:28px;color:#fff;margin:auto;"></i>
          </div>
          <!-- Name & subtitle -->
          <div class="flex-1 min-w-0">
            <div class="text-lg font-bold" style="color: var(--color-text-primary);">料理达人</div>
            <div class="text-sm mt-1" style="color: var(--color-text-tertiary);">已烹饪 128 道菜</div>
          </div>
          <!-- Settings button -->
          <button class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style="background: rgba(255,255,255,0.6);">
            <i data-lucide="settings" style="width:18px;height:18px;color:var(--color-text-secondary);"></i>
          </button>
        </div>
      </div>

      <!-- Stats Row -->
      <div class="px-5 mt-4">
        <div class="rounded-xl flex items-center" style="background: var(--color-surface); box-shadow: var(--shadow-card); padding: 1rem 0;">
          <!-- Stat 1 -->
          <div class="flex-1 flex flex-col items-center gap-1" style="border-right: 1px solid var(--color-border-light);">
            <i data-lucide="chef-hat" style="width:20px;height:20px;color:var(--color-primary);"></i>
            <div class="text-lg font-bold" style="color: var(--color-text-primary);">128</div>
            <div class="text-xs" style="color: var(--color-text-tertiary);">美食</div>
          </div>
          <!-- Stat 2 -->
          <div class="flex-1 flex flex-col items-center gap-1" style="border-right: 1px solid var(--color-border-light);">
            <i data-lucide="heart" style="width:20px;height:20px;color:var(--color-primary);"></i>
            <div class="text-lg font-bold" style="color: var(--color-text-primary);">56</div>
            <div class="text-xs" style="color: var(--color-text-tertiary);">收藏</div>
          </div>
          <!-- Stat 3 -->
          <div class="flex-1 flex flex-col items-center gap-1">
            <i data-lucide="flame" style="width:20px;height:20px;color:var(--color-primary);"></i>
            <div class="text-lg font-bold" style="color: var(--color-text-primary);">12 天</div>
            <div class="text-xs" style="color: var(--color-text-tertiary);">连续</div>
          </div>
        </div>
      </div>

      <!-- My Preferences Section -->
      <div class="px-5 mt-6">
        <div class="flex items-center justify-between mb-3">
          <div class="text-base font-bold" style="color: var(--color-text-primary);">我的口味偏好</div>
          <button class="w-7 h-7 rounded-full flex items-center justify-center" style="background: var(--color-surface-overlay);">
            <i data-lucide="pencil" style="width:14px;height:14px;color:var(--color-text-tertiary);"></i>
          </button>
        </div>
        <div class="flex flex-wrap gap-2">
          <span class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-sm" style="background: var(--color-surface); color: var(--color-text-primary); box-shadow: var(--shadow-sm);">
            <i data-lucide="flame" style="width:14px;height:14px;color:var(--state-error);"></i> 微辣
          </span>
          <span class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-sm" style="background: var(--color-surface); color: var(--color-text-primary); box-shadow: var(--shadow-sm);">
            <i data-lucide="soup" style="width:14px;height:14px;color:var(--color-primary);"></i> 家常
          </span>
          <span class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-sm" style="background: var(--color-surface); color: var(--color-text-primary); box-shadow: var(--shadow-sm);">
            <i data-lucide="salad" style="width:14px;height:14px;color:var(--state-success);"></i> 健康低脂
          </span>
          <span class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-sm" style="background: var(--color-surface); color: var(--color-text-primary); box-shadow: var(--shadow-sm);">
            <i data-lucide="cake-slice" style="width:14px;height:14px;color:var(--color-primary-light);"></i> 甜品
          </span>
          <button class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-sm" style="border: 1.5px dashed var(--color-border); color: var(--color-text-tertiary); background: transparent;">
            <i data-lucide="plus" style="width:14px;height:14px;"></i> 添加
          </button>
        </div>
      </div>

      <!-- Favorite Recipes Section -->
      <div class="px-5 mt-6">
        <div class="flex items-center justify-between mb-3">
          <div class="text-base font-bold" style="color: var(--color-text-primary);">我的收藏</div>
          <a href="#" class="text-sm" style="color: var(--color-primary);">查看全部</a>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <!-- Recipe Card 1 -->
          <div class="rounded-xl overflow-hidden" style="background: var(--color-surface); box-shadow: var(--shadow-card);">
            <img src="../assets/image_10_yi19x4.jpg" alt="红烧排骨" class="aspect-square w-full object-cover" />
            <div class="p-3">
              <div class="text-sm font-semibold truncate" style="color: var(--color-text-primary);">红烧排骨</div>
              <div class="text-xs mt-1 flex items-center gap-0.5" style="color: var(--color-text-tertiary);"><i data-lucide="star" style="width:12px;height:12px;color:var(--state-warning);fill:var(--state-warning);"></i> 4.9</div>
            </div>
          </div>
          <!-- Recipe Card 2 -->
          <div class="rounded-xl overflow-hidden" style="background: var(--color-surface); box-shadow: var(--shadow-card);">
            <img src="../assets/image_11_yi19x4.jpg" alt="番茄蛋汤" class="aspect-square w-full object-cover" />
            <div class="p-3">
              <div class="text-sm font-semibold truncate" style="color: var(--color-text-primary);">番茄蛋汤</div>
              <div class="text-xs mt-1 flex items-center gap-0.5" style="color: var(--color-text-tertiary);"><i data-lucide="star" style="width:12px;height:12px;color:var(--state-warning);fill:var(--state-warning);"></i> 4.7</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Settings List Section -->
      <div class="px-5 mt-6">
        <div class="text-base font-bold mb-3" style="color: var(--color-text-primary);">设置</div>
        <div class="rounded-xl overflow-hidden" style="background: var(--color-surface); box-shadow: var(--shadow-card);">
          <!-- Item 1: 烹饪提醒 -->
          <div class="flex items-center px-4 py-4" style="border-bottom: 1px solid var(--color-border-light);">
            <div class="flex items-center gap-3 flex-1 min-w-0">
              <i data-lucide="bell" style="width:18px;height:18px;color:var(--color-primary);"></i>
              <span class="text-sm" style="color: var(--color-text-primary);">烹饪提醒</span>
            </div>
            <!-- Toggle ON -->
            <div class="relative w-11 h-6 rounded-full cursor-pointer" style="background: var(--state-success);">
              <div class="absolute top-0.5 right-0.5 w-5 h-5 rounded-full bg-white" style="box-shadow: var(--shadow-sm);"></div>
            </div>
          </div>
          <!-- Item 2: 火候灵敏度 -->
          <div class="flex items-center px-4 py-4" style="border-bottom: 1px solid var(--color-border-light);">
            <div class="flex items-center gap-3 flex-1 min-w-0">
              <i data-lucide="flame" style="width:18px;height:18px;color:var(--color-primary);"></i>
              <div>
                <div class="text-sm" style="color: var(--color-text-primary);">火候灵敏度</div>
                <div class="text-xs" style="color: var(--color-text-tertiary);">中等</div>
              </div>
            </div>
            <i data-lucide="chevron-right" style="width:16px;height:16px;color:var(--color-text-tertiary);"></i>
          </div>
          <!-- Item 3: 深色模式 -->
          <div class="flex items-center px-4 py-4" style="border-bottom: 1px solid var(--color-border-light);">
            <div class="flex items-center gap-3 flex-1 min-w-0">
              <i data-lucide="moon" style="width:18px;height:18px;color:var(--color-text-secondary);"></i>
              <span class="text-sm" style="color: var(--color-text-primary);">深色模式</span>
            </div>
            <!-- Toggle OFF -->
            <div class="relative w-11 h-6 rounded-full cursor-pointer" style="background: var(--color-border);">
              <div class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white" style="box-shadow: var(--shadow-sm);"></div>
            </div>
          </div>
          <!-- Item 4: 通知设置 -->
          <div class="flex items-center px-4 py-4" style="border-bottom: 1px solid var(--color-border-light);">
            <div class="flex items-center gap-3 flex-1 min-w-0">
              <i data-lucide="smartphone" style="width:18px;height:18px;color:var(--color-text-secondary);"></i>
              <span class="text-sm" style="color: var(--color-text-primary);">通知设置</span>
            </div>
            <i data-lucide="chevron-right" style="width:16px;height:16px;color:var(--color-text-tertiary);"></i>
          </div>
          <!-- Item 5: 帮助与反馈 -->
          <div class="flex items-center px-4 py-4" style="border-bottom: 1px solid var(--color-border-light);">
            <div class="flex items-center gap-3 flex-1 min-w-0">
              <i data-lucide="help-circle" style="width:18px;height:18px;color:var(--color-text-secondary);"></i>
              <span class="text-sm" style="color: var(--color-text-primary);">帮助与反馈</span>
            </div>
            <i data-lucide="chevron-right" style="width:16px;height:16px;color:var(--color-text-tertiary);"></i>
          </div>
          <!-- Item 6: 关于我们 -->
          <div class="flex items-center px-4 py-4">
            <div class="flex items-center gap-3 flex-1 min-w-0">
              <i data-lucide="info" style="width:18px;height:18px;color:var(--color-text-secondary);"></i>
              <span class="text-sm" style="color: var(--color-text-primary);">关于我们</span>
            </div>
            <i data-lucide="chevron-right" style="width:16px;height:16px;color:var(--color-text-tertiary);"></i>
          </div>
        </div>
      </div>

      <!-- Bottom spacer -->
      <div class="h-4"></div>

      <!-- Bottom Tab Bar (fixed) -->
      <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[375px] flex items-end justify-around px-2 pt-2 pb-5" style="background: var(--color-surface); box-shadow: 0 -1px 8px rgba(61,43,31,0.06); z-index: var(--z-above);">
        <!-- 首页 -->
        <a href="#" class="flex flex-col items-center gap-0.5" style="color: var(--color-text-tertiary);">
          <i data-lucide="home" style="width:22px;height:22px;"></i>
          <span class="text-xs">首页</span>
        </a>
        <!-- 发现 -->
        <a href="#" class="flex flex-col items-center gap-0.5" style="color: var(--color-text-tertiary);">
          <i data-lucide="compass" style="width:22px;height:22px;"></i>
          <span class="text-xs">发现</span>
        </a>
        <!-- 拍照 (center camera button) -->
        <a href="#" class="flex flex-col items-center -mt-4">
          <div class="w-12 h-12 rounded-full flex items-center justify-center" style="background: var(--color-primary); box-shadow: 0 4px 12px rgba(232,116,59,0.3);">
            <i data-lucide="camera" style="width:22px;height:22px;color:#fff;"></i>
          </div>
          <span class="text-xs mt-1" style="color: var(--color-text-tertiary);">拍照</span>
        </a>
        <!-- 我的 (active) -->
        <a href="#" data-active="true" class="flex flex-col items-center gap-0.5" style="color: var(--color-primary);">
          <i data-lucide="user" style="width:22px;height:22px;"></i>
          <span class="text-xs font-semibold">我的</span>
        </a>
      </nav>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>

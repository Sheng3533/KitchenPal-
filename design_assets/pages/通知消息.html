<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知消息</title>
    <style id="theme-vars">
/* AI Kitchen Assistant - Warm Natural Style */
:root {
  /* Brand Primary - Warm Orange */
  --color-primary: #E8743B;
  --color-primary-light: #F09B6E;
  --color-primary-lighter: #F5C49E;
  --color-primary-lightest: #FBE8D6;
  --color-primary-dark: #C45E2A;
  --color-primary-darker: #9A4A20;

  /* Brand Secondary - Warm Brown */
  --color-secondary: #8B5E3C;
  --color-secondary-light: #B07D55;
  --color-secondary-lighter: #D4A87A;

  /* Neutrals - Warm Toned */
  --color-bg: #FEFAF5;
  --color-bg-warm: #FFF8F0;
  --color-surface: #FFFFFF;
  --color-surface-raised: #FFFCF8;
  --color-surface-overlay: #F5EDE4;
  --color-border: #E8DDD0;
  --color-border-light: #F0E8DE;
  --color-text-primary: #3D2B1F;
  --color-text-secondary: #6B5744;
  --color-text-tertiary: #9A8B7A;
  --color-text-inverse: #FFFFFF;
  --color-text-on-primary: #FFFFFF;

  /* State Colors */
  --state-success: #4A9D5B;
  --state-success-bg: #E8F5EA;
  --state-warning: #E8A33D;
  --state-warning-bg: #FFF4E0;
  --state-error: #D94B4B;
  --state-error-bg: #FDE8E8;
  --state-info: #5B8EC9;
  --state-info-bg: #E8F0FA;

  /* Radius Scale */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Shadows - surface-first, subtle */
  --shadow-sm: 0 1px 3px rgba(61, 43, 31, 0.04);
  --shadow-md: 0 2px 8px rgba(61, 43, 31, 0.06);
  --shadow-lg: 0 4px 16px rgba(61, 43, 31, 0.08);
  --shadow-card: 0 1px 4px rgba(61, 43, 31, 0.05);
  --shadow-card-hover: 0 4px 12px rgba(61, 43, 31, 0.1);
  --shadow-float: 0 8px 32px rgba(61, 43, 31, 0.12);

  /* Typography */
  --font-display: 'DM Serif Display', 'Noto Serif SC', Georgia, serif;
  --font-body: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  /* Type Scale */
  --text-xs: 0.6875rem;     /* 11px */
  --text-sm: 0.8125rem;     /* 13px */
  --text-base: 0.9375rem;    /* 15px */
  --text-md: 1rem;           /* 16px */
  --text-lg: 1.125rem;      /* 18px */
  --text-xl: 1.3125rem;     /* 21px */
  --text-2xl: 1.5rem;       /* 24px */
  --text-3xl: 1.875rem;     /* 30px */
  --text-4xl: 2.25rem;      /* 36px */

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* Z-index */
  --z-above: 10;
  --z-overlay: 50;
  --z-modal: 100;
  --z-toast: 200;
}

/* Typography Classes */
.font-display { font-family: var(--font-display); }
.font-body { font-family: var(--font-body); }
.font-mono { font-family: var(--font-mono); }

.text-primary-color { color: var(--color-primary); }
.text-secondary-color { color: var(--color-secondary); }
.text-warm { color: var(--color-text-primary); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-[375px] mx-auto min-h-screen" style="background: var(--color-bg);">

      <!-- Top Bar -->
      <div class="flex items-center justify-between px-4 py-3" style="background: var(--color-surface);">
        <button data-dom-id="back-notif" class="w-9 h-9 flex items-center justify-center rounded-full" style="background: var(--color-border-light);">
          <i data-lucide="arrow-left" class="w-5 h-5" style="color: var(--color-text-primary);"></i>
        </button>
        <h1 class="text-lg font-semibold" style="color: var(--color-text-primary); font-family: var(--font-body);">通知消息</h1>
        <button class="text-sm" style="color: var(--color-primary); font-family: var(--font-body);">全部已读</button>
      </div>

      <!-- Tab Filters -->
      <div class="flex gap-2 px-4 py-3" style="background: var(--color-surface);">
        <button class="px-4 py-1.5 rounded-full text-sm font-medium" style="background: var(--color-primary); color: var(--color-text-on-primary); font-family: var(--font-body);">全部</button>
        <button class="px-4 py-1.5 rounded-full text-sm font-medium" style="background: var(--color-border-light); color: var(--color-text-secondary); font-family: var(--font-body);">烹饪提醒</button>
        <button class="px-4 py-1.5 rounded-full text-sm font-medium" style="background: var(--color-border-light); color: var(--color-text-secondary); font-family: var(--font-body);">系统通知</button>
      </div>

      <div class="px-4 pt-4 pb-8">

        <!-- Today Section -->
        <div class="mb-3">
          <h2 class="text-base font-semibold mb-1" style="color: var(--color-text-primary); font-family: var(--font-body);">今天</h2>
          <span class="text-xs" style="color: var(--color-text-tertiary); font-family: var(--font-body);">7月11日</span>
        </div>

        <!-- Notification 1 - UNREAD -->
        <div class="flex items-start gap-3 p-4 mb-3 rounded-xl" style="background: var(--color-surface); box-shadow: var(--shadow-card); border-radius: var(--radius-xl);">
          <div class="flex-shrink-0 relative">
            <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background: var(--color-primary-lightest);">
              <i data-lucide="flame" class="w-5 h-5" style="color: var(--color-primary);"></i>
            </div>
            <span class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full" style="background: var(--color-primary);"></span>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold mb-0.5 truncate" style="color: var(--color-text-primary); font-family: var(--font-body);">炖牛腩火候提醒</p>
            <p class="text-xs leading-relaxed" style="color: var(--color-text-secondary); font-family: var(--font-body);">已炖煮40分钟，建议检查火候并翻动牛腩</p>
          </div>
          <span class="flex-shrink-0 text-xs mt-0.5" style="color: var(--color-text-tertiary); font-family: var(--font-body);">10分钟前</span>
        </div>

        <!-- Notification 2 - UNREAD -->
        <div class="flex items-start gap-3 p-4 mb-3 rounded-xl" style="background: var(--color-surface); box-shadow: var(--shadow-card); border-radius: var(--radius-xl);">
          <div class="flex-shrink-0 relative">
            <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background: var(--color-primary-lightest);">
              <i data-lucide="sparkles" class="w-5 h-5" style="color: var(--color-primary);"></i>
            </div>
            <span class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full" style="background: var(--color-primary);"></span>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold mb-0.5 truncate" style="color: var(--color-text-primary); font-family: var(--font-body);">新食谱推荐</p>
            <p class="text-xs leading-relaxed" style="color: var(--color-text-secondary); font-family: var(--font-body);">根据您最近烹饪记录，推荐3道新菜谱</p>
          </div>
          <span class="flex-shrink-0 text-xs mt-0.5" style="color: var(--color-text-tertiary); font-family: var(--font-body);">1小时前</span>
        </div>

        <!-- Notification 3 - READ -->
        <div class="flex items-start gap-3 p-4 mb-3 rounded-xl" style="background: var(--color-surface); box-shadow: var(--shadow-card); border-radius: var(--radius-xl);">
          <div class="flex-shrink-0">
            <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background: var(--color-border-light);">
              <i data-lucide="chef-hat" class="w-5 h-5" style="color: var(--color-text-tertiary);"></i>
            </div>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium mb-0.5 truncate" style="color: var(--color-text-secondary); font-family: var(--font-body);">烹饪完成记录</p>
            <p class="text-xs leading-relaxed" style="color: var(--color-text-tertiary); font-family: var(--font-body);">您上次制作的番茄炒蛋已自动记录</p>
          </div>
          <span class="flex-shrink-0 text-xs mt-0.5" style="color: var(--color-text-tertiary); font-family: var(--font-body);">3小时前</span>
        </div>

        <!-- Notification 4 - READ -->
        <div class="flex items-start gap-3 p-4 mb-3 rounded-xl" style="background: var(--color-surface); box-shadow: var(--shadow-card); border-radius: var(--radius-xl);">
          <div class="flex-shrink-0">
            <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background: var(--color-border-light);">
              <i data-lucide="heart" class="w-5 h-5" style="color: var(--color-text-tertiary);"></i>
            </div>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium mb-0.5 truncate" style="color: var(--color-text-secondary); font-family: var(--font-body);">收藏食谱更新</p>
            <p class="text-xs leading-relaxed" style="color: var(--color-text-tertiary); font-family: var(--font-body);">您收藏的"红烧排骨"新增了2个做法技巧</p>
          </div>
          <span class="flex-shrink-0 text-xs mt-0.5" style="color: var(--color-text-tertiary); font-family: var(--font-body);">昨天</span>
        </div>

        <!-- Yesterday Section -->
        <div class="mb-3 mt-6">
          <h2 class="text-base font-semibold mb-1" style="color: var(--color-text-primary); font-family: var(--font-body);">昨天</h2>
          <span class="text-xs" style="color: var(--color-text-tertiary); font-family: var(--font-body);">7月10日</span>
        </div>

        <!-- Notification 5 - READ -->
        <div class="flex items-start gap-3 p-4 mb-3 rounded-xl" style="background: var(--color-surface); box-shadow: var(--shadow-card); border-radius: var(--radius-xl);">
          <div class="flex-shrink-0">
            <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background: var(--color-border-light);">
              <i data-lucide="gift" class="w-5 h-5" style="color: var(--color-text-tertiary);"></i>
            </div>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium mb-0.5 truncate" style="color: var(--color-text-secondary); font-family: var(--font-body);">每周烹饪报告已生成</p>
            <p class="text-xs leading-relaxed" style="color: var(--color-text-tertiary); font-family: var(--font-body);">点击查看您本周的烹饪数据和营养分析</p>
          </div>
          <span class="flex-shrink-0 text-xs mt-0.5" style="color: var(--color-text-tertiary); font-family: var(--font-body);">昨天 18:00</span>
        </div>

        <!-- Notification 6 - READ -->
        <div class="flex items-start gap-3 p-4 mb-3 rounded-xl" style="background: var(--color-surface); box-shadow: var(--shadow-card); border-radius: var(--radius-xl);">
          <div class="flex-shrink-0">
            <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background: var(--color-border-light);">
              <i data-lucide="megaphone" class="w-5 h-5" style="color: var(--color-text-tertiary);"></i>
            </div>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium mb-0.5 truncate" style="color: var(--color-text-secondary); font-family: var(--font-body);">系统更新通知</p>
            <p class="text-xs leading-relaxed" style="color: var(--color-text-tertiary); font-family: var(--font-body);">v2.5版本已发布，新增AI火候预测功能</p>
          </div>
          <span class="flex-shrink-0 text-xs mt-0.5" style="color: var(--color-text-tertiary); font-family: var(--font-body);">昨天 10:00</span>
        </div>

      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>

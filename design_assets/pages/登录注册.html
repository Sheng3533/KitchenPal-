<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录注册</title>
    <style id="theme-vars">
/* AI Kitchen Assistant - Warm Natural Style */
:root {
  /* Brand Primary - Warm Orange */
  --color-primary: #E8743B;
  --color-primary-light: #F09B6E;
  --color-primary-lighter: #F5C49E;
  --color-primary-lightest: #FBE8D6;
  --color-primary-dark: #C45E2A;
  --color-primary-darker: #9A4A20;

  /* Brand Secondary - Warm Brown */
  --color-secondary: #8B5E3C;
  --color-secondary-light: #B07D55;
  --color-secondary-lighter: #D4A87A;

  /* Neutrals - Warm Toned */
  --color-bg: #FEFAF5;
  --color-bg-warm: #FFF8F0;
  --color-surface: #FFFFFF;
  --color-surface-raised: #FFFCF8;
  --color-surface-overlay: #F5EDE4;
  --color-border: #E8DDD0;
  --color-border-light: #F0E8DE;
  --color-text-primary: #3D2B1F;
  --color-text-secondary: #6B5744;
  --color-text-tertiary: #9A8B7A;
  --color-text-inverse: #FFFFFF;
  --color-text-on-primary: #FFFFFF;

  /* State Colors */
  --state-success: #4A9D5B;
  --state-success-bg: #E8F5EA;
  --state-warning: #E8A33D;
  --state-warning-bg: #FFF4E0;
  --state-error: #D94B4B;
  --state-error-bg: #FDE8E8;
  --state-info: #5B8EC9;
  --state-info-bg: #E8F0FA;

  /* Radius Scale */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Shadows - surface-first, subtle */
  --shadow-sm: 0 1px 3px rgba(61, 43, 31, 0.04);
  --shadow-md: 0 2px 8px rgba(61, 43, 31, 0.06);
  --shadow-lg: 0 4px 16px rgba(61, 43, 31, 0.08);
  --shadow-card: 0 1px 4px rgba(61, 43, 31, 0.05);
  --shadow-card-hover: 0 4px 12px rgba(61, 43, 31, 0.1);
  --shadow-float: 0 8px 32px rgba(61, 43, 31, 0.12);

  /* Typography */
  --font-display: 'DM Serif Display', 'Noto Serif SC', Georgia, serif;
  --font-body: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  /* Type Scale */
  --text-xs: 0.6875rem;     /* 11px */
  --text-sm: 0.8125rem;     /* 13px */
  --text-base: 0.9375rem;    /* 15px */
  --text-md: 1rem;           /* 16px */
  --text-lg: 1.125rem;      /* 18px */
  --text-xl: 1.3125rem;     /* 21px */
  --text-2xl: 1.5rem;       /* 24px */
  --text-3xl: 1.875rem;     /* 30px */
  --text-4xl: 2.25rem;      /* 36px */

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* Z-index */
  --z-above: 10;
  --z-overlay: 50;
  --z-modal: 100;
  --z-toast: 200;
}

/* Typography Classes */
.font-display { font-family: var(--font-display); }
.font-body { font-family: var(--font-body); }
.font-mono { font-family: var(--font-mono); }

.text-primary-color { color: var(--color-primary); }
.text-secondary-color { color: var(--color-secondary); }
.text-warm { color: var(--color-text-primary); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      body {
        background: var(--color-bg);
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
      .tab-active {
        color: var(--color-primary);
        position: relative;
        font-weight: 600;
      }
      .tab-active::after {
        content: '';
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        width: 32px;
        height: 3px;
        background: var(--color-primary);
        border-radius: var(--radius-full);
      }
      .tab-inactive {
        color: var(--color-text-tertiary);
        font-weight: 400;
      }
      .input-field {
        background: var(--color-bg);
        border: 1.5px solid var(--color-border);
        border-radius: var(--radius-xl);
        padding: 14px 16px 14px 48px;
        width: 100%;
        font-size: var(--text-base);
        color: var(--color-text-primary);
        outline: none;
        transition: border-color 0.2s ease;
      }
      .input-field::placeholder {
        color: var(--color-text-tertiary);
      }
      .input-field:focus {
        border-color: var(--color-primary);
      }
      .login-btn {
        background: var(--color-primary);
        color: var(--color-text-on-primary);
        border: none;
        border-radius: var(--radius-full);
        width: 100%;
        padding: 14px 0;
        font-size: var(--text-lg);
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.1s ease;
      }
      .login-btn:active {
        transform: scale(0.98);
        background: var(--color-primary-dark);
      }
      .divider-line {
        flex: 1;
        height: 1px;
        background: var(--color-border);
      }
      .social-icon {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .social-icon:active {
        transform: scale(0.93);
      }
      .code-btn {
        color: var(--color-primary);
        font-size: var(--text-sm);
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
      }
      .code-btn:active {
        opacity: 0.7;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen flex flex-col" style="background: var(--color-bg);">

      <!-- Top Illustration Area -->
      <div class="flex flex-col items-center pt-16 pb-8 px-6" style="background: linear-gradient(180deg, var(--color-primary-lighter) 0%, var(--color-bg) 100%);">
        <!-- Chef Icon Circle -->
        <div class="flex items-center justify-center rounded-full mb-5" style="width: 80px; height: 80px; background: var(--color-primary-lighter); box-shadow: 0 4px 16px rgba(232, 116, 59, 0.2);">
          <i data-lucide="chef-hat" style="width: 40px; height: 40px; color: var(--color-primary);"></i>
        </div>
        <!-- App Name -->
        <h1 class="font-display text-center mb-2" style="font-size: var(--text-3xl); color: var(--color-text-primary); font-weight: 700;">
          料理助手
        </h1>
        <!-- Tagline -->
        <p class="text-center" style="font-size: var(--text-sm); color: var(--color-text-tertiary);">
          让每一道菜都恰到好处
        </p>
      </div>

      <!-- Login Form Card -->
      <div class="mx-6 p-6 rounded-2xl" style="background: var(--color-surface); box-shadow: var(--shadow-card); margin-top: -8px; border-radius: var(--radius-xl);">
        <!-- Tab Switcher -->
        <div class="flex justify-center gap-10 mb-8">
          <button class="tab-active pb-1" style="font-size: var(--text-lg); border: none; background: none; cursor: pointer;">
            登录
          </button>
          <button class="tab-inactive pb-1" style="font-size: var(--text-lg); border: none; background: none; cursor: pointer;">
            注册
          </button>
        </div>

        <!-- Phone Number Input -->
        <div class="relative mb-4">
          <div class="absolute left-4 top-1/2 -translate-y-1/2 flex items-center" style="color: var(--color-text-tertiary);">
            <i data-lucide="smartphone" style="width: 20px; height: 20px;"></i>
          </div>
          <input type="tel" class="input-field" placeholder="请输入手机号" maxlength="11">
        </div>

        <!-- Verification Code Input -->
        <div class="relative mb-6">
          <div class="absolute left-4 top-1/2 -translate-y-1/2 flex items-center" style="color: var(--color-text-tertiary);">
            <i data-lucide="lock" style="width: 20px; height: 20px;"></i>
          </div>
          <input type="text" class="input-field" placeholder="请输入验证码" maxlength="6" style="padding-right: 110px;">
          <button class="code-btn absolute right-4 top-1/2 -translate-y-1/2">
            获取验证码
          </button>
        </div>

        <!-- Login Button -->
        <button class="login-btn" data-dom-id="cta-login">
          登录
        </button>

        <!-- Divider -->
        <div class="flex items-center gap-4 my-6">
          <div class="divider-line"></div>
          <span style="font-size: var(--text-xs); color: var(--color-text-tertiary); white-space: nowrap;">其他登录方式</span>
          <div class="divider-line"></div>
        </div>

        <!-- Social Login Icons -->
        <div class="flex justify-center gap-6">
          <!-- WeChat -->
          <div class="social-icon" style="background: #07C160;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M8.5 11a1 1 0 100-2 1 1 0 000 2zM5.5 11a1 1 0 100-2 1 1 0 000 2zM17 13.5a.75.75 0 100-1.5.75.75 0 000 1.5zM14.5 13.5a.75.75 0 100-1.5.75.75 0 000 1.5z" fill="white"/>
              <path d="M9.5 4C5.36 4 2 6.69 2 10c0 1.87 1.05 3.54 2.7 4.65L4 17l2.5-1.25C7.6 16.24 8.52 16.5 9.5 16.5c.17 0 .33-.01.5-.02-.1-.47-.15-.96-.15-1.48C9.85 11.36 13.11 9 17 9c.34 0 .67.02 1 .06C17.36 6.16 13.8 4 9.5 4zM22 14c0-2.76-3.13-5-7-5s-7 2.24-7 5 3.13 5 7 5c.85 0 1.66-.1 2.4-.3L20.5 20l-.5-2.1C21.15 16.95 22 15.55 22 14z" fill="white"/>
            </svg>
          </div>
          <!-- Apple -->
          <div class="social-icon" style="background: #1D1D1F;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.53-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" fill="white"/>
            </svg>
          </div>
          <!-- Phone -->
          <div class="social-icon" style="background: var(--color-primary); box-shadow: 0 2px 8px rgba(232, 116, 59, 0.3);">
            <i data-lucide="phone" style="width: 22px; height: 22px; color: white;"></i>
          </div>
        </div>
      </div>

      <!-- Bottom spacer -->
      <div class="flex-1"></div>

      <!-- Agreement Text -->
      <div class="text-center py-6 px-8">
        <p style="font-size: var(--text-xs); color: var(--color-text-tertiary);">
          登录即同意<a href="#" style="color: var(--color-primary); text-decoration: none;">《用户协议》</a>和<a href="#" style="color: var(--color-primary); text-decoration: none;">《隐私政策》</a>
        </p>
      </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>

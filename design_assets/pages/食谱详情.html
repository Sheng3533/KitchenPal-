<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食谱详情</title>
    <style id="theme-vars">
/* AI Kitchen Assistant - Warm Natural Style */
:root {
  /* Brand Primary - Warm Orange */
  --color-primary: #E8743B;
  --color-primary-light: #F09B6E;
  --color-primary-lighter: #F5C49E;
  --color-primary-lightest: #FBE8D6;
  --color-primary-dark: #C45E2A;
  --color-primary-darker: #9A4A20;

  /* Brand Secondary - Warm Brown */
  --color-secondary: #8B5E3C;
  --color-secondary-light: #B07D55;
  --color-secondary-lighter: #D4A87A;

  /* Neutrals - Warm Toned */
  --color-bg: #FEFAF5;
  --color-bg-warm: #FFF8F0;
  --color-surface: #FFFFFF;
  --color-surface-raised: #FFFCF8;
  --color-surface-overlay: #F5EDE4;
  --color-border: #E8DDD0;
  --color-border-light: #F0E8DE;
  --color-text-primary: #3D2B1F;
  --color-text-secondary: #6B5744;
  --color-text-tertiary: #9A8B7A;
  --color-text-inverse: #FFFFFF;
  --color-text-on-primary: #FFFFFF;

  /* State Colors */
  --state-success: #4A9D5B;
  --state-success-bg: #E8F5EA;
  --state-warning: #E8A33D;
  --state-warning-bg: #FFF4E0;
  --state-error: #D94B4B;
  --state-error-bg: #FDE8E8;
  --state-info: #5B8EC9;
  --state-info-bg: #E8F0FA;

  /* Radius Scale */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Shadows - surface-first, subtle */
  --shadow-sm: 0 1px 3px rgba(61, 43, 31, 0.04);
  --shadow-md: 0 2px 8px rgba(61, 43, 31, 0.06);
  --shadow-lg: 0 4px 16px rgba(61, 43, 31, 0.08);
  --shadow-card: 0 1px 4px rgba(61, 43, 31, 0.05);
  --shadow-card-hover: 0 4px 12px rgba(61, 43, 31, 0.1);
  --shadow-float: 0 8px 32px rgba(61, 43, 31, 0.12);

  /* Typography */
  --font-display: 'DM Serif Display', 'Noto Serif SC', Georgia, serif;
  --font-body: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  /* Type Scale */
  --text-xs: 0.6875rem;     /* 11px */
  --text-sm: 0.8125rem;     /* 13px */
  --text-base: 0.9375rem;    /* 15px */
  --text-md: 1rem;           /* 16px */
  --text-lg: 1.125rem;      /* 18px */
  --text-xl: 1.3125rem;     /* 21px */
  --text-2xl: 1.5rem;       /* 24px */
  --text-3xl: 1.875rem;     /* 30px */
  --text-4xl: 2.25rem;      /* 36px */

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* Z-index */
  --z-above: 10;
  --z-overlay: 50;
  --z-modal: 100;
  --z-toast: 200;
}

/* Typography Classes */
.font-display { font-family: var(--font-display); }
.font-body { font-family: var(--font-body); }
.font-mono { font-family: var(--font-mono); }

.text-primary-color { color: var(--color-primary); }
.text-secondary-color { color: var(--color-secondary); }
.text-warm { color: var(--color-text-primary); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="pb-24 max-w-[375px] mx-auto" style="background: var(--color-bg);">

        <!-- Hero Image Section -->
        <section class="relative w-full h-56 overflow-hidden">
            <img src="../assets/image_9_yi19x4.jpg" alt="番茄炖牛腩" class="w-full h-full object-cover" />
            <!-- Gradient overlay -->
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/20 to-transparent"></div>

            <!-- Back button -->
            <button data-dom-id="back-recommend" class="absolute top-4 left-4 w-10 h-10 rounded-full bg-white/90 backdrop-blur-sm flex items-center justify-center shadow-md" aria-label="返回">
                <i data-lucide="arrow-left" class="w-5 h-5" style="color: var(--color-text-primary);"></i>
            </button>

            <!-- Favorite button -->
            <button class="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/90 backdrop-blur-sm flex items-center justify-center shadow-md" aria-label="收藏">
                <i data-lucide="heart" class="w-5 h-5" style="color: var(--color-primary);"></i>
            </button>

            <!-- Title overlay at bottom -->
            <div class="absolute bottom-4 left-4 right-4">
                <h1 class="text-2xl font-display text-white drop-shadow-lg mb-1">番茄炖牛腩</h1>
                <div class="flex items-center gap-2">
                    <span class="text-white/85 text-sm">45分钟</span>
                    <span class="text-white/40">·</span>
                    <span class="text-white/85 text-sm">中等难度</span>
                    <span class="text-white/40">·</span>
                    <span class="text-white/85 text-sm">3人份</span>
                </div>
            </div>
        </section>

        <!-- Recipe Info Bar -->
        <section class="bg-white py-4 px-2 flex items-center justify-around shadow-card">
            <!-- 难度 -->
            <div class="flex flex-col items-center gap-1 flex-1">
                <div class="flex items-center gap-1.5">
                    <i data-lucide="flame" class="w-4 h-4" style="color: var(--color-primary);"></i>
                    <span class="text-xs" style="color: var(--color-text-tertiary);">难度</span>
                </div>
                <span class="text-sm font-medium" style="color: var(--color-text-primary);">中等</span>
            </div>
            <!-- Divider -->
            <div class="w-px h-8" style="background: var(--color-border-light);"></div>
            <!-- 时间 -->
            <div class="flex flex-col items-center gap-1 flex-1">
                <div class="flex items-center gap-1.5">
                    <i data-lucide="clock" class="w-4 h-4" style="color: var(--color-primary);"></i>
                    <span class="text-xs" style="color: var(--color-text-tertiary);">时间</span>
                </div>
                <span class="text-sm font-medium" style="color: var(--color-text-primary);">45min</span>
            </div>
            <!-- Divider -->
            <div class="w-px h-8" style="background: var(--color-border-light);"></div>
            <!-- 热量 -->
            <div class="flex flex-col items-center gap-1 flex-1">
                <div class="flex items-center gap-1.5">
                    <i data-lucide="zap" class="w-4 h-4" style="color: var(--color-primary);"></i>
                    <span class="text-xs" style="color: var(--color-text-tertiary);">热量</span>
                </div>
                <span class="text-sm font-medium" style="color: var(--color-text-primary);">380kcal</span>
            </div>
        </section>

        <!-- Ingredients Section -->
        <section class="mt-4 mx-4">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-lg font-medium flex items-center gap-2" style="color: var(--color-text-primary);">
                    <i data-lucide="list-checks" class="w-5 h-5" style="color: var(--color-primary);"></i>
                    食材清单
                </h2>
                <button class="flex items-center gap-1 text-sm px-3 py-1 rounded-full" style="background: var(--color-primary-lightest); color: var(--color-primary);">
                    <i data-lucide="check-circle" class="w-4 h-4"></i>
                    已备齐
                </button>
            </div>

            <div class="bg-white rounded-xl p-4 shadow-card space-y-0">
                <!-- Checked items -->
                <div class="flex items-center justify-between py-3 border-b" style="border-color: var(--color-border-light);">
                    <div class="flex items-center gap-3">
                        <div class="w-5 h-5 rounded-full flex items-center justify-center" style="background: var(--color-primary);">
                            <i data-lucide="check" class="w-3 h-3 text-white"></i>
                        </div>
                        <span class="text-sm" style="color: var(--color-text-primary);">牛腩</span>
                    </div>
                    <span class="text-sm" style="color: var(--color-text-secondary);">500g</span>
                </div>
                <div class="flex items-center justify-between py-3 border-b" style="border-color: var(--color-border-light);">
                    <div class="flex items-center gap-3">
                        <div class="w-5 h-5 rounded-full flex items-center justify-center" style="background: var(--color-primary);">
                            <i data-lucide="check" class="w-3 h-3 text-white"></i>
                        </div>
                        <span class="text-sm" style="color: var(--color-text-primary);">番茄</span>
                    </div>
                    <span class="text-sm" style="color: var(--color-text-secondary);">3个</span>
                </div>
                <div class="flex items-center justify-between py-3 border-b" style="border-color: var(--color-border-light);">
                    <div class="flex items-center gap-3">
                        <div class="w-5 h-5 rounded-full flex items-center justify-center" style="background: var(--color-primary);">
                            <i data-lucide="check" class="w-3 h-3 text-white"></i>
                        </div>
                        <span class="text-sm" style="color: var(--color-text-primary);">洋葱</span>
                    </div>
                    <span class="text-sm" style="color: var(--color-text-secondary);">1个</span>
                </div>
                <div class="flex items-center justify-between py-3 border-b" style="border-color: var(--color-border-light);">
                    <div class="flex items-center gap-3">
                        <div class="w-5 h-5 rounded-full flex items-center justify-center" style="background: var(--color-primary);">
                            <i data-lucide="check" class="w-3 h-3 text-white"></i>
                        </div>
                        <span class="text-sm" style="color: var(--color-text-primary);">大蒜</span>
                    </div>
                    <span class="text-sm" style="color: var(--color-text-secondary);">5瓣</span>
                </div>
                <!-- Unchecked items -->
                <div class="flex items-center justify-between py-3 border-b" style="border-color: var(--color-border-light);">
                    <div class="flex items-center gap-3">
                        <div class="w-5 h-5 rounded-full border-2" style="border-color: var(--color-border);"></div>
                        <span class="text-sm" style="color: var(--color-text-primary);">生姜</span>
                    </div>
                    <span class="text-sm" style="color: var(--color-text-secondary);">3片</span>
                </div>
                <div class="flex items-center justify-between py-3 border-b" style="border-color: var(--color-border-light);">
                    <div class="flex items-center gap-3">
                        <div class="w-5 h-5 rounded-full border-2" style="border-color: var(--color-border);"></div>
                        <span class="text-sm" style="color: var(--color-text-primary);">料酒</span>
                    </div>
                    <span class="text-sm" style="color: var(--color-text-secondary);">2勺</span>
                </div>
                <div class="flex items-center justify-between py-3 border-b" style="border-color: var(--color-border-light);">
                    <div class="flex items-center gap-3">
                        <div class="w-5 h-5 rounded-full border-2" style="border-color: var(--color-border);"></div>
                        <span class="text-sm" style="color: var(--color-text-primary);">盐</span>
                    </div>
                    <span class="text-sm" style="color: var(--color-text-secondary);">适量</span>
                </div>
                <div class="flex items-center justify-between py-3">
                    <div class="flex items-center gap-3">
                        <div class="w-5 h-5 rounded-full border-2" style="border-color: var(--color-border);"></div>
                        <span class="text-sm" style="color: var(--color-text-primary);">冰糖</span>
                    </div>
                    <span class="text-sm" style="color: var(--color-text-secondary);">15g</span>
                </div>
            </div>
        </section>

        <!-- Cooking Steps Section -->
        <section class="mt-6 mx-4">
            <h2 class="text-lg font-medium flex items-center gap-2 mb-3" style="color: var(--color-text-primary);">
                <i data-lucide="chef-hat" class="w-5 h-5" style="color: var(--color-primary);"></i>
                烹饪步骤
            </h2>

            <div class="space-y-3">
                <!-- Step 1 -->
                <div class="bg-white rounded-xl p-4 shadow-card">
                    <div class="flex gap-3">
                        <div class="w-7 h-7 rounded-full flex-shrink-0 flex items-center justify-center text-sm font-medium text-white" style="background: var(--color-primary);">
                            1
                        </div>
                        <div class="flex-1">
                            <p class="text-sm leading-relaxed" style="color: var(--color-text-primary);">
                                牛腩切块，冷水下锅焯水去血沫，捞出沥干备用
                            </p>
                            <div class="mt-2 inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs" style="background: #FFF4E0; color: var(--state-warning);">
                                <span>&#x1F525;</span>
                                <span>大火煮沸后转小火</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Step 2 -->
                <div class="bg-white rounded-xl p-4 shadow-card">
                    <div class="flex gap-3">
                        <div class="w-7 h-7 rounded-full flex-shrink-0 flex items-center justify-center text-sm font-medium text-white" style="background: var(--color-primary);">
                            2
                        </div>
                        <div class="flex-1">
                            <p class="text-sm leading-relaxed" style="color: var(--color-text-primary);">
                                番茄划十字，开水烫后去皮切块
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Step 3 -->
                <div class="bg-white rounded-xl p-4 shadow-card">
                    <div class="flex gap-3">
                        <div class="w-7 h-7 rounded-full flex-shrink-0 flex items-center justify-center text-sm font-medium text-white" style="background: var(--color-primary);">
                            3
                        </div>
                        <div class="flex-1">
                            <p class="text-sm leading-relaxed" style="color: var(--color-text-primary);">
                                锅中热油，放入葱姜蒜爆香，加入牛腩翻炒上色
                            </p>
                            <div class="mt-2 inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs" style="background: #FFF4E0; color: var(--state-warning);">
                                <span>&#x1F525;</span>
                                <span>中火翻炒3分钟</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Step 4 -->
                <div class="bg-white rounded-xl p-4 shadow-card">
                    <div class="flex gap-3">
                        <div class="w-7 h-7 rounded-full flex-shrink-0 flex items-center justify-center text-sm font-medium text-white" style="background: var(--color-primary);">
                            4
                        </div>
                        <div class="flex-1">
                            <p class="text-sm leading-relaxed" style="color: var(--color-text-primary);">
                                加入番茄块和足量热水，大火烧开后转小火炖40分钟
                            </p>
                            <div class="mt-2 inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs" style="background: #FFF4E0; color: var(--state-warning);">
                                <span>&#x1F525;</span>
                                <span>大火转小火是关键</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Bottom Fixed CTA -->
    <div class="fixed bottom-0 left-0 right-0 z-above px-4 py-3" style="background: var(--color-surface); box-shadow: 0 -2px 12px rgba(61, 43, 31, 0.06);">
        <div class="max-w-[375px] mx-auto">
            <button data-dom-id="cta-start-cooking" class="w-full py-4 rounded-full text-white text-base font-medium shadow-lg flex items-center justify-center gap-2" style="background: var(--color-primary); box-shadow: var(--shadow-lg);">
                <i data-lucide="play" class="w-5 h-5"></i>
                开始烹饪
            </button>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>

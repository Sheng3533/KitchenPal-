<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>识别结果</title>
    <style id="theme-vars">
/* AI Kitchen Assistant - Warm Natural Style */
:root {
  /* Brand Primary - Warm Orange */
  --color-primary: #E8743B;
  --color-primary-light: #F09B6E;
  --color-primary-lighter: #F5C49E;
  --color-primary-lightest: #FBE8D6;
  --color-primary-dark: #C45E2A;
  --color-primary-darker: #9A4A20;

  /* Brand Secondary - Warm Brown */
  --color-secondary: #8B5E3C;
  --color-secondary-light: #B07D55;
  --color-secondary-lighter: #D4A87A;

  /* Neutrals - Warm Toned */
  --color-bg: #FEFAF5;
  --color-bg-warm: #FFF8F0;
  --color-surface: #FFFFFF;
  --color-surface-raised: #FFFCF8;
  --color-surface-overlay: #F5EDE4;
  --color-border: #E8DDD0;
  --color-border-light: #F0E8DE;
  --color-text-primary: #3D2B1F;
  --color-text-secondary: #6B5744;
  --color-text-tertiary: #9A8B7A;
  --color-text-inverse: #FFFFFF;
  --color-text-on-primary: #FFFFFF;

  /* State Colors */
  --state-success: #4A9D5B;
  --state-success-bg: #E8F5EA;
  --state-warning: #E8A33D;
  --state-warning-bg: #FFF4E0;
  --state-error: #D94B4B;
  --state-error-bg: #FDE8E8;
  --state-info: #5B8EC9;
  --state-info-bg: #E8F0FA;

  /* Radius Scale */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Shadows - surface-first, subtle */
  --shadow-sm: 0 1px 3px rgba(61, 43, 31, 0.04);
  --shadow-md: 0 2px 8px rgba(61, 43, 31, 0.06);
  --shadow-lg: 0 4px 16px rgba(61, 43, 31, 0.08);
  --shadow-card: 0 1px 4px rgba(61, 43, 31, 0.05);
  --shadow-card-hover: 0 4px 12px rgba(61, 43, 31, 0.1);
  --shadow-float: 0 8px 32px rgba(61, 43, 31, 0.12);

  /* Typography */
  --font-display: 'DM Serif Display', 'Noto Serif SC', Georgia, serif;
  --font-body: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  /* Type Scale */
  --text-xs: 0.6875rem;     /* 11px */
  --text-sm: 0.8125rem;     /* 13px */
  --text-base: 0.9375rem;    /* 15px */
  --text-md: 1rem;           /* 16px */
  --text-lg: 1.125rem;      /* 18px */
  --text-xl: 1.3125rem;     /* 21px */
  --text-2xl: 1.5rem;       /* 24px */
  --text-3xl: 1.875rem;     /* 30px */
  --text-4xl: 2.25rem;      /* 36px */

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* Z-index */
  --z-above: 10;
  --z-overlay: 50;
  --z-modal: 100;
  --z-toast: 200;
}

/* Typography Classes */
.font-display { font-family: var(--font-display); }
.font-body { font-family: var(--font-body); }
.font-mono { font-family: var(--font-mono); }

.text-primary-color { color: var(--color-primary); }
.text-secondary-color { color: var(--color-secondary); }
.text-warm { color: var(--color-text-primary); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-[375px] mx-auto min-h-screen" style="background-color: var(--color-bg);">

        <!-- Top Bar -->
        <header class="flex items-center justify-between px-4 py-3" style="background-color: var(--color-surface);">
            <button data-dom-id="back-camera" class="w-10 h-10 flex items-center justify-center rounded-full" style="color: var(--color-text-primary);">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>
            <h1 class="text-[var(--text-md)] font-semibold" style="color: var(--color-text-primary);">识别结果</h1>
            <button class="w-10 h-10 flex items-center justify-center rounded-full" style="color: var(--color-text-primary);">
                <i data-lucide="share-2" class="w-5 h-5"></i>
            </button>
        </header>

        <!-- Success Banner -->
        <div class="mx-4 mt-4 flex items-center gap-2 px-4 py-3 rounded-xl" style="background-color: var(--state-success-bg);">
            <div class="w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0" style="background-color: var(--state-success);">
                <i data-lucide="check" class="w-3.5 h-3.5" style="color: var(--color-text-inverse);"></i>
            </div>
            <span class="text-[var(--text-sm)] font-medium" style="color: var(--state-success);">成功识别 3 种食材</span>
        </div>

        <!-- Identified Ingredients Section -->
        <section class="mt-6 px-4">
            <h2 class="text-[var(--text-lg)] font-semibold mb-3" style="color: var(--color-text-primary);">已识别食材</h2>
            <div class="grid grid-cols-3 gap-3">

                <!-- Tomato Card -->
                <div class="rounded-xl p-2 flex flex-col items-center" style="background-color: var(--color-surface); box-shadow: var(--shadow-card);">
                    <img src="../assets/image_0_yi19x4.jpg" alt="番茄" class="w-full h-24 object-cover rounded-lg" style="border-radius: var(--radius-lg);">
                    <span class="text-[var(--text-sm)] font-medium mt-2" style="color: var(--color-text-primary);">番茄</span>
                    <div class="w-full mt-1.5 h-1.5 rounded-full overflow-hidden" style="background-color: var(--color-border-light);">
                        <div class="h-full rounded-full" style="width: 98%; background-color: var(--state-success);"></div>
                    </div>
                    <span class="text-[var(--text-xs)] mt-1" style="color: var(--color-text-tertiary);">98%</span>
                    <span class="text-[var(--text-xs)] mt-0.5" style="color: var(--color-text-tertiary);">约200g</span>
                </div>

                <!-- Onion Card -->
                <div class="rounded-xl p-2 flex flex-col items-center" style="background-color: var(--color-surface); box-shadow: var(--shadow-card);">
                    <img src="../assets/image_1_yi19x4.jpg" alt="洋葱" class="w-full h-24 object-cover rounded-lg" style="border-radius: var(--radius-lg);">
                    <span class="text-[var(--text-sm)] font-medium mt-2" style="color: var(--color-text-primary);">洋葱</span>
                    <div class="w-full mt-1.5 h-1.5 rounded-full overflow-hidden" style="background-color: var(--color-border-light);">
                        <div class="h-full rounded-full" style="width: 95%; background-color: var(--state-success);"></div>
                    </div>
                    <span class="text-[var(--text-xs)] mt-1" style="color: var(--color-text-tertiary);">95%</span>
                    <span class="text-[var(--text-xs)] mt-0.5" style="color: var(--color-text-tertiary);">约150g</span>
                </div>

                <!-- Garlic Card -->
                <div class="rounded-xl p-2 flex flex-col items-center" style="background-color: var(--color-surface); box-shadow: var(--shadow-card);">
                    <img src="../assets/image_2_yi19x4.jpg" alt="大蒜" class="w-full h-24 rounded-lg object-cover" style="border-radius: var(--radius-lg);" />
                    <span class="text-[var(--text-sm)] font-medium mt-2" style="color: var(--color-text-primary);">大蒜</span>
                    <div class="w-full mt-1.5 h-1.5 rounded-full overflow-hidden" style="background-color: var(--color-border-light);">
                        <div class="h-full rounded-full" style="width: 91%; background-color: var(--state-success);"></div>
                    </div>
                    <span class="text-[var(--text-xs)] mt-1" style="color: var(--color-text-tertiary);">91%</span>
                    <span class="text-[var(--text-xs)] mt-0.5" style="color: var(--color-text-tertiary);">约30g</span>
                </div>

            </div>
        </section>

        <!-- AI Suggestion Section -->
        <section class="mt-6 px-4">
            <div class="flex items-center gap-2 mb-1">
                <i data-lucide="sparkles" class="w-5 h-5" style="color: var(--color-primary);"></i>
                <h2 class="text-[var(--text-lg)] font-semibold" style="color: var(--color-text-primary);">AI推荐食谱</h2>
            </div>
            <p class="text-[var(--text-sm)] mb-3" style="color: var(--color-text-tertiary);">根据您的食材，为您推荐以下食谱</p>
            <div class="flex gap-3 overflow-x-auto no-scrollbar pb-2">

                <!-- Recipe Suggestion Card 1 -->
                <div class="flex-shrink-0 w-48 rounded-xl overflow-hidden" style="background-color: var(--color-surface); box-shadow: var(--shadow-card);">
                    <img src="../assets/image_3_yi19x4.jpg" alt="番茄意面" class="w-full h-28 object-cover">
                    <div class="p-3">
                        <h3 class="text-[var(--text-sm)] font-semibold" style="color: var(--color-text-primary);">番茄意面</h3>
                        <span class="inline-block mt-1.5 text-[var(--text-xs)] font-medium px-2 py-0.5 rounded-full" style="background-color: var(--state-success-bg); color: var(--state-success);">匹配度 92%</span>
                    </div>
                </div>

                <!-- Recipe Suggestion Card 2 -->
                <div class="flex-shrink-0 w-48 rounded-xl overflow-hidden" style="background-color: var(--color-surface); box-shadow: var(--shadow-card);">
                    <img src="../assets/image_4_yi19x4.jpg" alt="番茄炖牛腩" class="w-full h-28 object-cover">
                    <div class="p-3">
                        <h3 class="text-[var(--text-sm)] font-semibold" style="color: var(--color-text-primary);">番茄炖牛腩</h3>
                        <span class="inline-block mt-1.5 text-[var(--text-xs)] font-medium px-2 py-0.5 rounded-full" style="background-color: var(--state-success-bg); color: var(--state-success);">匹配度 85%</span>
                    </div>
                </div>

            </div>
        </section>

        <!-- Bottom Action -->
        <div class="px-4 mt-8 pb-8">
            <button data-dom-id="link-recipes" class="w-full py-3.5 rounded-full text-[var(--text-md)] font-semibold flex items-center justify-center gap-2" style="background-color: var(--color-primary); color: var(--color-text-inverse);">
                查看更多食谱
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>

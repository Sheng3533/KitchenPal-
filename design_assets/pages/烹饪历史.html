<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>烹饪历史</title>
    <style id="theme-vars">
/* AI Kitchen Assistant - Warm Natural Style */
:root {
  /* Brand Primary - Warm Orange */
  --color-primary: #E8743B;
  --color-primary-light: #F09B6E;
  --color-primary-lighter: #F5C49E;
  --color-primary-lightest: #FBE8D6;
  --color-primary-dark: #C45E2A;
  --color-primary-darker: #9A4A20;

  /* Brand Secondary - Warm Brown */
  --color-secondary: #8B5E3C;
  --color-secondary-light: #B07D55;
  --color-secondary-lighter: #D4A87A;

  /* Neutrals - Warm Toned */
  --color-bg: #FEFAF5;
  --color-bg-warm: #FFF8F0;
  --color-surface: #FFFFFF;
  --color-surface-raised: #FFFCF8;
  --color-surface-overlay: #F5EDE4;
  --color-border: #E8DDD0;
  --color-border-light: #F0E8DE;
  --color-text-primary: #3D2B1F;
  --color-text-secondary: #6B5744;
  --color-text-tertiary: #9A8B7A;
  --color-text-inverse: #FFFFFF;
  --color-text-on-primary: #FFFFFF;

  /* State Colors */
  --state-success: #4A9D5B;
  --state-success-bg: #E8F5EA;
  --state-warning: #E8A33D;
  --state-warning-bg: #FFF4E0;
  --state-error: #D94B4B;
  --state-error-bg: #FDE8E8;
  --state-info: #5B8EC9;
  --state-info-bg: #E8F0FA;

  /* Radius Scale */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Shadows - surface-first, subtle */
  --shadow-sm: 0 1px 3px rgba(61, 43, 31, 0.04);
  --shadow-md: 0 2px 8px rgba(61, 43, 31, 0.06);
  --shadow-lg: 0 4px 16px rgba(61, 43, 31, 0.08);
  --shadow-card: 0 1px 4px rgba(61, 43, 31, 0.05);
  --shadow-card-hover: 0 4px 12px rgba(61, 43, 31, 0.1);
  --shadow-float: 0 8px 32px rgba(61, 43, 31, 0.12);

  /* Typography */
  --font-display: 'DM Serif Display', 'Noto Serif SC', Georgia, serif;
  --font-body: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  /* Type Scale */
  --text-xs: 0.6875rem;     /* 11px */
  --text-sm: 0.8125rem;     /* 13px */
  --text-base: 0.9375rem;    /* 15px */
  --text-md: 1rem;           /* 16px */
  --text-lg: 1.125rem;      /* 18px */
  --text-xl: 1.3125rem;     /* 21px */
  --text-2xl: 1.5rem;       /* 24px */
  --text-3xl: 1.875rem;     /* 30px */
  --text-4xl: 2.25rem;      /* 36px */

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* Z-index */
  --z-above: 10;
  --z-overlay: 50;
  --z-modal: 100;
  --z-toast: 200;
}

/* Typography Classes */
.font-display { font-family: var(--font-display); }
.font-body { font-family: var(--font-body); }
.font-mono { font-family: var(--font-mono); }

.text-primary-color { color: var(--color-primary); }
.text-secondary-color { color: var(--color-secondary); }
.text-warm { color: var(--color-text-primary); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-secondary: var(--color-secondary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen" style="background-color: var(--color-bg);">
      <!-- Top Bar -->
      <header class="sticky top-0 z-[var(--z-above)] flex items-center justify-between px-4 py-3" style="background-color: var(--color-bg);">
        <button data-dom-id="back-history" class="flex items-center justify-center w-9 h-9 rounded-full" style="background-color: var(--color-surface); box-shadow: var(--shadow-card);">
          <i data-lucide="arrow-left" class="w-5 h-5" style="color: var(--color-text-primary);"></i>
        </button>
        <h1 class="text-[var(--text-lg)] font-semibold" style="color: var(--color-text-primary); font-family: var(--font-body);">烹饪历史</h1>
        <button class="flex items-center justify-center w-9 h-9 rounded-full" style="background-color: var(--color-surface); box-shadow: var(--shadow-card);">
          <i data-lucide="calendar" class="w-5 h-5" style="color: var(--color-text-primary);"></i>
        </button>
      </header>

      <div class="px-4 pb-8 pt-2 max-w-md mx-auto">
        <!-- Stats Summary Card -->
        <div class="rounded-[var(--radius-xl)] p-5 mb-6" style="background-color: var(--color-surface); box-shadow: var(--shadow-card);">
          <div class="flex items-center gap-2 mb-4">
            <div class="flex items-center justify-center w-7 h-7 rounded-full" style="background-color: var(--color-primary-lightest);">
              <i data-lucide="calendar-days" class="w-4 h-4" style="color: var(--color-primary);"></i>
            </div>
            <span class="text-[var(--text-base)] font-semibold" style="color: var(--color-text-primary);">本月数据</span>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <!-- Stat 1: 烹饪次数 -->
            <div class="flex items-center gap-3 rounded-[var(--radius-md)] p-3" style="background-color: var(--color-bg);">
              <div class="flex items-center justify-center w-10 h-10 rounded-full shrink-0" style="background-color: var(--color-primary-lightest);">
                <i data-lucide="chef-hat" class="w-5 h-5" style="color: var(--color-primary);"></i>
              </div>
              <div>
                <div class="text-[var(--text-xl)] font-bold leading-tight" style="color: var(--color-text-primary);">28<span class="text-[var(--text-sm)] font-normal ml-0.5" style="color: var(--color-text-tertiary);">次</span></div>
                <div class="text-[var(--text-xs)]" style="color: var(--color-text-tertiary);">烹饪</div>
              </div>
            </div>
            <!-- Stat 2: 总时长 -->
            <div class="flex items-center gap-3 rounded-[var(--radius-md)] p-3" style="background-color: var(--color-bg);">
              <div class="flex items-center justify-center w-10 h-10 rounded-full shrink-0" style="background-color: var(--state-info-bg);">
                <i data-lucide="clock" class="w-5 h-5" style="color: var(--state-info);"></i>
              </div>
              <div>
                <div class="text-[var(--text-xl)] font-bold leading-tight" style="color: var(--color-text-primary);">14<span class="text-[var(--text-sm)] font-normal ml-0.5" style="color: var(--color-text-tertiary);">h</span></div>
                <div class="text-[var(--text-xs)]" style="color: var(--color-text-tertiary);">总时长</div>
              </div>
            </div>
            <!-- Stat 3: 新学菜 -->
            <div class="flex items-center gap-3 rounded-[var(--radius-md)] p-3" style="background-color: var(--color-bg);">
              <div class="flex items-center justify-center w-10 h-10 rounded-full shrink-0" style="background-color: var(--state-warning-bg);">
                <i data-lucide="sparkles" class="w-5 h-5" style="color: var(--state-warning);"></i>
              </div>
              <div>
                <div class="text-[var(--text-xl)] font-bold leading-tight" style="color: var(--color-text-primary);">5<span class="text-[var(--text-sm)] font-normal ml-0.5" style="color: var(--color-text-tertiary);">道</span></div>
                <div class="text-[var(--text-xs)]" style="color: var(--color-text-tertiary);">新学</div>
              </div>
            </div>
            <!-- Stat 4: 完美率 -->
            <div class="flex items-center gap-3 rounded-[var(--radius-md)] p-3" style="background-color: var(--color-bg);">
              <div class="flex items-center justify-center w-10 h-10 rounded-full shrink-0" style="background-color: var(--state-success-bg);">
                <i data-lucide="trophy" class="w-5 h-5" style="color: var(--state-success);"></i>
              </div>
              <div>
                <div class="text-[var(--text-xl)] font-bold leading-tight" style="color: var(--color-text-primary);">89<span class="text-[var(--text-sm)] font-normal ml-0.5" style="color: var(--color-text-tertiary);">%</span></div>
                <div class="text-[var(--text-xs)]" style="color: var(--color-text-tertiary);">完美率</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Timeline: 7月11日 · 今天 -->
        <div class="mb-2">
          <div class="flex items-center gap-2 mb-3">
            <span class="text-[var(--text-sm)] font-semibold" style="color: var(--color-text-primary);">7月11日</span>
            <span class="text-[var(--text-xs)] px-2 py-0.5 rounded-full" style="background-color: var(--color-primary-lightest); color: var(--color-primary);">今天</span>
          </div>

          <!-- Timeline Item 1: 番茄炖牛腩 -->
          <div class="flex gap-3 mb-3">
            <!-- Timeline Line -->
            <div class="flex flex-col items-center shrink-0 pt-4">
              <div class="w-3 h-3 rounded-full border-2" style="border-color: var(--color-primary); background-color: var(--color-primary-lightest);"></div>
              <div class="w-0.5 flex-1 mt-1" style="background-color: var(--color-border);"></div>
            </div>
            <!-- Card -->
            <a data-dom-id="link-history-recipe" href="#" class="flex-1 rounded-[var(--radius-lg)] p-3 flex gap-3 no-underline" style="background-color: var(--color-surface); box-shadow: var(--shadow-card);">
              <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between mb-1">
                  <h3 class="text-[var(--text-base)] font-semibold truncate" style="color: var(--color-text-primary);">番茄炖牛腩</h3>
                  <span class="text-[var(--text-xs)] shrink-0 ml-2" style="color: var(--color-text-tertiary);">12:30</span>
                </div>
                <p class="text-[var(--text-xs)] mb-1.5" style="color: var(--color-text-secondary);">45分钟 · 火候调整3次 · 得分96分</p>
                <div class="flex items-center gap-0.5">
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                </div>
              </div>
              <img src="../assets/image_4_yi19x4.jpg" alt="番茄炖牛腩" class="w-16 h-16 rounded-[var(--radius-md)] object-cover shrink-0" />
            </a>
          </div>

          <!-- Timeline Item 2: 蒜蓉西兰花 -->
          <div class="flex gap-3 mb-3">
            <!-- Timeline Line -->
            <div class="flex flex-col items-center shrink-0 pt-4">
              <div class="w-3 h-3 rounded-full border-2" style="border-color: var(--color-primary); background-color: var(--color-primary-lightest);"></div>
              <div class="w-0.5 flex-1 mt-1" style="background-color: var(--color-border);"></div>
            </div>
            <!-- Card -->
            <div class="flex-1 rounded-[var(--radius-lg)] p-3 flex gap-3" style="background-color: var(--color-surface); box-shadow: var(--shadow-card);">
              <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between mb-1">
                  <h3 class="text-[var(--text-base)] font-semibold truncate" style="color: var(--color-text-primary);">蒜蓉西兰花</h3>
                  <span class="text-[var(--text-xs)] shrink-0 ml-2" style="color: var(--color-text-tertiary);">18:45</span>
                </div>
                <p class="text-[var(--text-xs)] mb-1.5" style="color: var(--color-text-secondary);">12分钟 · 得分92分</p>
                <div class="flex items-center gap-0.5">
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-border);"></i>
                </div>
              </div>
              <img src="../assets/image_12_yi19x4.jpg" alt="蒜蓉西兰花" class="w-16 h-16 rounded-[var(--radius-md)] object-cover shrink-0" />
            </div>
          </div>
        </div>

        <!-- Timeline: 7月9日 · 周三 -->
        <div class="mb-2">
          <div class="flex items-center gap-2 mb-3">
            <span class="text-[var(--text-sm)] font-semibold" style="color: var(--color-text-primary);">7月9日</span>
            <span class="text-[var(--text-xs)]" style="color: var(--color-text-tertiary);">周三</span>
          </div>

          <!-- Timeline Item 3: 青椒肉丝 -->
          <div class="flex gap-3 mb-3">
            <div class="flex flex-col items-center shrink-0 pt-4">
              <div class="w-3 h-3 rounded-full border-2" style="border-color: var(--color-primary); background-color: var(--color-primary-lightest);"></div>
              <div class="w-0.5 flex-1 mt-1" style="background-color: var(--color-border);"></div>
            </div>
            <div class="flex-1 rounded-[var(--radius-lg)] p-3 flex gap-3" style="background-color: var(--color-surface); box-shadow: var(--shadow-card);">
              <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between mb-1">
                  <h3 class="text-[var(--text-base)] font-semibold truncate" style="color: var(--color-text-primary);">青椒肉丝</h3>
                  <span class="text-[var(--text-xs)] shrink-0 ml-2" style="color: var(--color-text-tertiary);">19:20</span>
                </div>
                <p class="text-[var(--text-xs)] mb-1.5" style="color: var(--color-text-secondary);">15分钟 · 得分88分</p>
                <div class="flex items-center gap-0.5">
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-border);"></i>
                </div>
              </div>
              <img src="../assets/image_5_yi19x4.jpg" alt="青椒肉丝" class="w-16 h-16 rounded-[var(--radius-md)] object-cover shrink-0" />
            </div>
          </div>

          <!-- Timeline Item 4: 山药药膳鸡汤 -->
          <div class="flex gap-3 mb-3">
            <div class="flex flex-col items-center shrink-0 pt-4">
              <div class="w-3 h-3 rounded-full border-2" style="border-color: var(--color-primary); background-color: var(--color-primary-lightest);"></div>
              <div class="w-0.5 flex-1 mt-1" style="background-color: var(--color-border);"></div>
            </div>
            <div class="flex-1 rounded-[var(--radius-lg)] p-3 flex gap-3" style="background-color: var(--color-surface); box-shadow: var(--shadow-card);">
              <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between mb-1">
                  <h3 class="text-[var(--text-base)] font-semibold truncate" style="color: var(--color-text-primary);">山药药膳鸡汤</h3>
                  <span class="text-[var(--text-xs)] shrink-0 ml-2" style="color: var(--color-text-tertiary);">11:00</span>
                </div>
                <p class="text-[var(--text-xs)] mb-1.5" style="color: var(--color-text-secondary);">90分钟 · 火候调整5次 · 得分94分</p>
                <div class="flex items-center gap-0.5">
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                </div>
              </div>
              <img src="../assets/image_6_yi19x4.jpg" alt="山药药膳鸡汤" class="w-16 h-16 rounded-[var(--radius-md)] object-cover shrink-0" />
            </div>
          </div>
        </div>

        <!-- Timeline: 7月7日 · 周一 -->
        <div class="mb-2">
          <div class="flex items-center gap-2 mb-3">
            <span class="text-[var(--text-sm)] font-semibold" style="color: var(--color-text-primary);">7月7日</span>
            <span class="text-[var(--text-xs)]" style="color: var(--color-text-tertiary);">周一</span>
          </div>

          <!-- Timeline Item 5: 番茄炒蛋 -->
          <div class="flex gap-3 mb-3">
            <div class="flex flex-col items-center shrink-0 pt-4">
              <div class="w-3 h-3 rounded-full border-2" style="border-color: var(--color-primary); background-color: var(--color-primary-lightest);"></div>
            </div>
            <div class="flex-1 rounded-[var(--radius-lg)] p-3 flex gap-3" style="background-color: var(--color-surface); box-shadow: var(--shadow-card);">
              <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between mb-1">
                  <h3 class="text-[var(--text-base)] font-semibold truncate" style="color: var(--color-text-primary);">番茄炒蛋</h3>
                  <span class="text-[var(--text-xs)] shrink-0 ml-2" style="color: var(--color-text-tertiary);">12:15</span>
                </div>
                <p class="text-[var(--text-xs)] mb-1.5" style="color: var(--color-text-secondary);">10分钟 · 得分98分</p>
                <div class="flex items-center gap-0.5">
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color: var(--color-primary); fill: var(--color-primary);"></i>
                </div>
              </div>
              <div class="w-16 h-16 rounded-[var(--radius-md)] shrink-0 flex items-center justify-center" style="background-color: var(--color-bg);">
                <i data-lucide="image" class="w-5 h-5" style="color: var(--color-text-tertiary);"></i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
